", "t": ["Ať si přinese jakej chce plán. Zatím mu ten proti mně nefunguje."], "pop": 0, "mom": 0.35, "jour": -0.3, "riv": 0.5, "spons": 0}]}, {"id": "pre_h2h_behind", "when": "pre", "need": ["h2hBehind"], "qs": ["Vzájemně zaostáváš {h2h}. Leze ti ta historie do nohou?", "{opp} tě už párkrát překonal. Co dneska změníš, aby to dopadlo jinak?", "Někteří říkají, že proti určitým typům ti to nesedí. Platí to i o {opp}?"], "as": [{"tone": "skromná", "t": ["Ta bilance mě štve, proto chci dneska začít jinou kapitolu. Poctivě, od prvního míčku.", "Poučil jsem se z těch proher. Dneska budu trpělivější."], "pop": 0.1, "mom": 0.25, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Staré zápasy jsou zavřený. Dneska jsem jinej hráč a chci to dokázat.", "Nesedí mi to jen do té doby, než mu to vrátím. A to chce být dneska."], "pop": 0.15, "mom": 0.55, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si tu sérii užije, dokud může. Jednou skončí, třeba dneska."], "pop": 0, "mom": 0.35, "jour": -0.2, "riv": 0.6, "spons": 0}]}, {"id": "pre_rival", "when": "pre", "need": ["rival"], "qs": ["Proti {opp} už je z toho rivalita. Těšíš se, nebo tě to vysává?", "Vaše vzájemné zápasy mají jiskru, která přesahuje tenis. Cítíš to i v šatně?", "Lidi na tuhle dvojici čekají. Nehrozí, že se necháš vyprovokovat?"], "as": [{"tone": "skromná", "t": ["Rivalita mě žene dopředu, ale nenechám se strhnout k hloupým věcem.", "Respektuju ho, i když spolu máme historii. Dneska chci hlavně vyhrát, ne se hádat."], "pop": 0.15, "mom": 0, "jour": 1.2, "riv": -0.1, "spons": 0}, {"tone": "sebevědomá", "t": ["Takový zápasy miluju. Čím víc to vře, tím líp se mi hraje.", "Ať je z toho zase představení. Tentokrát s mým koncem."], "pop": 0.25, "mom": 0.5, "jour": 0, "riv": 0.3, "spons": 0}, {"tone": "provokativní", "t": ["On ví, že ho nemusím, já vím, že on nemusí mě. To stačí, ať to zůstane na kurtu – nebo i kousek za ním.", "Lidi chtějí jiskru. Dneska ji dostanou."], "pop": 0.2, "mom": 0.3, "jour": -0.5, "riv": 0.8, "spons": 0}, {"tone": "vtipná", "t": ["Kdybychom se měli rádi, bylo by to nuda a vy byste neměli o čem psát."], "pop": 0.22, "mom": 0, "jour": 1.3, "riv": 0.2, "spons": 0}]}, {"id": "pre_clay", "when": "pre", "need": ["clay"], "qs": ["Antuka je o trpělivosti. Máš ji dneska v nohách i v hlavě?", "Na antuce se zápasy natahují. Jak se na to těšíš?", "Kluzký povrch, dlouhý výměny. Je to tvůj parketa, nebo spíš povinnost?"], "as": [{"tone": "skromná", "t": ["Antuka trestá spěch. Chci bejt trpělivej a stavět tlak postupně.", "Těším se na dlouhý výměny, tam se ukáže, kdo je líp připravenej."], "pop": 0, "mom": 0.25, "jour": 0.7, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Na antuce se cítím jako doma. Dneska chci {opp} vytáčet do rohů.", "Mám nohy i trpělivost. To je na tomhle povrchu základ."], "pop": 0.12, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když skončím oranžovej od hlavy až k patě, bude to znamenat, že jsem se aspoň pral."], "pop": 0.18, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_grass", "when": "pre", "need": ["grass"], "qs": ["Tráva je rychlá a trestuje první chybu. Jsi na ni naladěný?", "Na trávě rozhoduje servis a odvaha. Máš dneska obojí?", "Někteří antukáři na trávě bloudí. Ty se na ní cítíš jistě?"], "as": [{"tone": "skromná", "t": ["Tráva chce pokoru. Musím bejt přesnej na servisu a nenechat se rozhodit odskokem.", "Je to jinej tenis, ale připravovali jsme se na něj."], "pop": 0, "mom": 0.2, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Na trávě chci bejt agresivní od prvního míčku. Tohle je můj povrch na odvahu.", "Servis dneska bude zbraň. Chci zkracovat výměny."], "pop": 0.12, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když míček po odskoku skončí u mých uší, aspoň vím, že jsme opravdu na trávě."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "pre_hard", "when": "pre", "need": ["hard"], "qs": ["Tvrdý povrch je základ okruhu. Cítíš se na něm jistě?", "Na betonu se hraje rychle a tvrdě na tělo. Jak jsi na tom se zdravím?", "Mnozí říkají, že hard je nejuniverzálnější. Sedí ti to?"], "as": [{"tone": "skromná", "t": ["Na hardu se cítím přirozeně, ale i tady se trestá ledabylost.", "Tělo mám v pořádku, připravovali jsme se na tenhle rytmus."], "pop": 0, "mom": 0.2, "jour": 0.6, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Tvrdý povrch mi sedí. Můžu kombinovat sílu i přesnost.", "Dneska chci ten zápas řídit od základní čáry i z podání."], "pop": 0.1, "mom": 0.4, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Povrch je, jakej je. Nechci z toho dělat vědu."], "pop": 0, "mom": 0, "jour": -0.2, "riv": 0, "spons": 0}]}, {"id": "pre_indoor", "when": "pre", "need": ["indoor"], "qs": ["Hala, rychlý odskok, žádný vítr. Vyhovuje ti to?", "V hale je slyšet každý dýchání z tribuny. Nerozbije tě to v koncentraci?", "Některým hráčům hala sedí víc než otevřený dvorec. Tobě?"], "as": [{"tone": "skromná", "t": ["Hala je čistá, podmínky stejný. To mi vyhovuje, nic se nevymlouvá na počasí.", "Soušťeďení musí bejt ostřejší, protože je tu ticho a každej zvuk nese."], "pop": 0, "mom": 0.2, "jour": 0.7, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["V hale hraju rád. Míč letí, jak chci, a já chci bejt ten, kdo diktuje.", "Ticho v hale mi nevadí. Moje podání v ní zní dobře."], "pop": 0.1, "mom": 0.4, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když spadne lžička v první řadě, slyší to i rozhodčí u čáry. To je hala."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "pre_surf_strong", "when": "pre", "need": ["surfStrong"], "qs": ["Na tomhle povrchu se ti tradičně daří. Cítíš tu výhodu?", "Soupeř o tobě ví, že {surf} je tvoje parketa. Nezneklidňuje ho to, myslíš?", "Je dneska povrch tvůj spojenec, nebo už na to všichni čekají a přizpůsobí se?"], "as": [{"tone": "skromná", "t": ["Sedí mi to, ale nic to nezaručuje. I na svém povrchu se musí makat.", "Výhoda je v pocitu, ne v tabulce. Tu musím potvrdit."], "pop": 0.1, "mom": 0.25, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Na {surf} se cítím nejsilnější a dneska to chci potvrdit výsledkem.", "Ať se přizpůsobuje. Já tu hraju tak, jak umím nejlíp."], "pop": 0.15, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Kdo chce dneska vyhrát na mým povrchu, musí předvést něco extra."], "pop": 0, "mom": 0.35, "jour": -0.2, "riv": 0.2, "spons": 0}]}, {"id": "pre_surf_weak", "when": "pre", "need": ["surfWeak"], "qs": ["Na {surf} to pro tebe historicky nebývá jednoduché. Jak s tím bojuješ?", "Není tenhle povrch tvůj nejmíň oblíbený? Co s tím dneska uděláš?", "Kritici říkají, že ti {surf} nesedí. Máš chuť jim to vrátit?"], "as": [{"tone": "skromná", "t": ["Není to můj nejjistější povrch, proto jsme na něm dřeli víc. Uvidíme, jestli to stačí.", "Beru to jako práci. Když se na něm zlepším, posunu se celý."], "pop": 0.1, "mom": 0.2, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["To je stará písnička. Dneska chci ukázat, že už to neplatí.", "Nesedělo, past tense. Jsem na to připravenej líp než dřív."], "pop": 0.15, "mom": 0.45, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když vyhraju, napíšete, že mi to najednou sedí. Když prohraju, že jsem to věděl. Krásná práce, že?"], "pop": 0.18, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "pre_gs", "when": "pre", "need": ["gs"], "qs": ["Grand Slam má jinou váhu. Cítíš ji už v šatně?", "Na majoru se hraje o dějiny, ne jen o body. Jak s tím v hlavě zacházíš?", "Největší turnaj roku – nebo aspoň jeden z nich. Spíš se tesně, nebo se bojíš?"], "as": [{"tone": "skromná", "t": ["Je to výjimečný týden a vážím si ho. Půjdu zápas od zápasu, nic víc.", "Váhu cítím, ale nesmím ji tahat s sebou na kurt."], "pop": 0.2, "mom": 0.2, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Na tohle jsem chtěl hrát od mala. Teď jsem tady a chci jít daleko.", "Grand Slam je přesně prostředí, kde chci ukázat, kdo jsem."], "pop": 0.3, "mom": 0.55, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když jdu ráno do areálu, mám oči jako kluk. Pak si řeknu, že mám taky zaplatit účet za hotel, a jdu makat."], "pop": 0.2, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}]}, {"id": "pre_m1000", "when": "pre", "need": ["m1000"], "qs": ["Masters je elitní týden. Patříš sem podle sebe už teď?", "Tady potkáš jen špičku. Je to tvůj přirozený prostor, nebo zatím stáž?", "Na Masters se body sčítají rychle. Cítíš tu příležitost?"], "as": [{"tone": "skromná", "t": ["Chci sem patřit, ale musím to dokázat výsledky, ne řečma.", "Je to vysoká laťka a já ji beru s pokorou."], "pop": 0.15, "mom": 0.2, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Patřím sem. A dneska to chci potvrdit proti {opp}.", "Tohle je úroveň, na který chci zůstat, ne jen zavítat."], "pop": 0.2, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Kdo si myslí, že jsem tu na stáži, ať se přijde podívat na kurt."], "pop": 0.12, "mom": 0.35, "jour": -0.3, "riv": 0, "spons": 0}]}, {"id": "pre_itf", "when": "pre", "need": ["itf"], "qs": ["ITF je dřina a malé tribuny, ale tady se rodí kariéra. Cítíš to tak?", "Někdo už kouká po větších akcích, ty ještě sbíráš body dole. Nespěcháš?", "V takových týdnech se rozhoduje, kdo se vůbec dostane mezi elitu. Bereš každý zápas vážně?"], "as": [{"tone": "skromná", "t": ["Tady se učím řemeslo. Každej zápas je cihla do domu, kterej chci postavit.", "Nespěchám. Když budu poctivej tady, nahoře to přijde."], "pop": 0.15, "mom": 0.15, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["I na ITF chci vypadat jako hráč, kterej brzo půjde výš.", "Sbírám body, ale hraju, jako by to byl velkej turnaj. To je můj standard."], "pop": 0.12, "mom": 0.4, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Malá tribuna, velký sny, levnější oběd. Klasickej začátek, ne?"], "pop": 0.18, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "pre_chall", "when": "pre", "need": ["chall"], "qs": ["Challenger je most mezi dřinou a ATP. Cítíš, že tu patříš už mezi ty, co jdou nahoru?", "Tady se hraje o velký posun na žebříčku. Spíš počítáš body, nebo hraješ tenis?", "Challengery bývají vyrovnané až do semifinále. Čekáš těžký týden?"], "as": [{"tone": "skromná", "t": ["Hraju tenis, body přijdou, když bude práce poctivá.", "Patřit sem nestačí, musím tu vyhrávat. To je jediný měřítko."], "pop": 0.12, "mom": 0.2, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Tohle je moje úroveň, od který chci odstartovat výš. Challenger beru jako odrazovej můstek.", "Těžký týden? Jo. Ale já na něj mám."], "pop": 0.15, "mom": 0.45, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["O žebříčku se bavme v neděli, teď je na stole jen dnešní zápas."], "pop": 0, "mom": 0, "jour": -0.2, "riv": 0, "spons": 0}]}, {"id": "pre_final", "when": "pre", "need": ["final"], "qs": ["Jsi ve finále. Splněný cíl, nebo teprve začátek odpoledne?", "Zítra se může psát o titulu. Jak s tím spíš?", "Finále je jiná nervozita. Máš ji pod kontrolou?"], "as": [{"tone": "skromná", "t": ["Do finále jsem rád, ale přišel jsem si pro titul, ne pro medaili za účast.", "Nervozita je, beru ji jako důkaz, že mi na tom záleží."], "pop": 0.25, "mom": 0.25, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Do finále jsem chtěl dojít a teď ho chci vyhrát. Žádný zadní vrátka.", "Jsem připravenej zvednout trofej, ne ji jen fotit z dálky."], "pop": 0.3, "mom": 0.6, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Spí se mi blbě, ale to je daň za to, že jsem ještě ve hře. Kávu si dám až po posledním míčku."], "pop": 0.2, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_semi", "when": "pre", "need": ["semi"], "qs": ["Semifinále. Už jen krok od velkého dne. Cítíš chuť, nebo opatrnost?", "Tady končí spousta týdnů. Chceš, aby tenhle pokračoval?", "Semifinále bývá nejtěžší zápas turnaje. Souhlasíš?"], "as": [{"tone": "skromná", "t": ["Chci jít dál, ale vím, že {opp} chce to samý. Bude to o důkladnosti.", "Souhlasím, semifinále má zvláštní tíhu. Půjdu do toho pokorně."], "pop": 0.15, "mom": 0.2, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Ten krok chci udělat já. Mám chuť i plán.", "Nejtežší bude pro něj, když zahraju svoje."], "pop": 0.15, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Kdo dneska zvolní, jde domů. Já volnit nehodlám."], "pop": 0, "mom": 0.35, "jour": 0, "riv": 0.2, "spons": 0}]}, {"id": "pre_r1", "when": "pre", "need": ["r1"], "qs": ["První kolo je past. Kolik hráčů na něm už skončilo s velkými ambicemi?", "Vstup do turnaje. Chceš začít klidně, nebo rovnou naložit?", "První kolo se špatně hraje, když je v hlavě už čtvrtfinále. Hlídáš se?"], "as": [{"tone": "skromná", "t": ["První kolo beru jako samostatnej turnaj. Nic dopředu.", "Chci začít věcně, bez křeče, a postupně přidávat."], "pop": 0.1, "mom": 0.15, "jour": 0.9, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Chci naložit od začátku a nenechat soupeře čichnout k zápasu.", "Do turnaje vstupuju s chutí, ne s opatrností."], "pop": 0.1, "mom": 0.4, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když budu v hlavě ve čtvrtfinále, skončím v šatně po dvou setech. Takže dneska jsem teprve v prvním kole, slibuju."], "pop": 0.18, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_qual", "when": "pre", "need": ["qual"], "qs": ["Kvalifikace je někdy těžší než hlavní soutěž. Cítíš to taky?", "Tři těžké zápasy, než vůbec vejdeš hlavní branou. Stojí ti to za to?", "V kvalifikaci nikdo netleská dopředu. Motivuje tě to, nebo štve?"], "as": [{"tone": "skromná", "t": ["Kvalifikace je poctivá práce. Když ji zvládnu, hlavní soutěž si víc užiju.", "Stojí. Každá brána na okruhu se musí otevřít raketou, ne přáním."], "pop": 0.15, "mom": 0.2, "jour": 1.1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Já tu bránu otevřu. Kvalifikace je jen další série zápasů, který chci vyhrát.", "Netrleská se, tak si potlesk nechám na hlavní soutěž."], "pop": 0.12, "mom": 0.45, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Hraje se v osm, snídaně je v šest a tribuna má osm lidí. To je tenis, jak má bejt, když začínáš."], "pop": 0.2, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "pre_home", "when": "pre", "need": ["home"], "qs": ["Hraješ doma. Je to křídla, nebo těžká zátěž očekávání?", "Domácí publikum umí pomoct i znervóznět. Jak to máš ty?", "Když tribuna křičí tvoje jméno, cítíš víc síly, nebo víc odpovědnosti?"], "as": [{"tone": "skromná", "t": ["Je to krásný a vážím si toho. Chci fanouškům ukázat poctivej výkon, výsledek ať přijde.", "Odpovědnost cítím, ale snažím se z ní udělat energii, ne kámen na krku."], "pop": 0.25, "mom": 0.25, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Doma chci vyhrávat. To je moje povinnost i radost.", "Tribuna je se mnou a já ji dneska nechci zklamat."], "pop": 0.35, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když křičí moje jméno správně, hraju líp. Když ho komolí, taky, jen se musím soustředit."], "pop": 0.2, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "pre_away", "when": "pre", "need": ["away"], "qs": ["Jsi host a tribuna bude spíš proti tobě. Vadí ti to?", "Venkovní zápas, jiná země, jiný jídlo, jiný dvorce. Jsi z toho vykolejenej, nebo otužilej?", "Někteří hráči venku blednou. Ty umíš hrát i v cizím prostředí?"], "as": [{"tone": "skromná", "t": ["Je to součást řemesla. Hraju stejně, ať křičí pro mě nebo proti mně.", "Otužilej. Cestování k okruhu patří, nesmím se na to vymlouvat."], "pop": 0.1, "mom": 0.15, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Proti mně? Tím líp, z toho se dá udělat palivo.", "Cizí prostředí mě nerozbije. Můj tenis cestuje se mnou."], "pop": 0.12, "mom": 0.4, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si křičí. Já stejně budu slyšet jenom míček – a svoje esá."], "pop": 0, "mom": 0.3, "jour": -0.2, "riv": 0, "spons": 0}]}, {"id": "pre_dc", "when": "pre", "need": ["dc"], "qs": ["Davis Cup je jiný tlak – hraješ za zemi, ne jen za sebe. Cítíš to v hrudi?", "Národní dres, spoluhráči na lavičce. Pomáhá ti to, nebo je to větší tíha?", "V Davis Cupu se píše jiná historie. Co bys chtěl, aby se dneska napsalo?"], "as": [{"tone": "skromná", "t": ["Je to čest a cítím tu zodpovědnost. Půjdu do toho pro tým a pro lidi doma.", "Tíha i křídla zároveň. Snažím se myslet na spoluhráče, ne na sebe."], "pop": 0.3, "mom": 0.25, "jour": 1.4, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Za tu zemi chci vyhrát. Dneska je to moje směna a já ji hodlám odvést.", "Ať se napíše, že jsme to odřeli a že jsem ten zápas utáhl."], "pop": 0.35, "mom": 0.55, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když vám na lavičce fandí kluci, který znáte roky, hraje se líp. I když trenér křičí hlasitějc než tribuna."], "pop": 0.2, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "pre_streak_win", "when": "pre", "need": ["streakWin"], "qs": ["Máš sérii {streak} výher. Necítíš, že už je čas, aby tě někdo zastavil?", "Jdeš ze zápasu do zápasu a padají ti samé výhry. Užíváš si to, nebo počítáš dny do konce?", "Taková série umí zvednout, ale i uspat. Jak se proti tomu bráníš?"], "as": [{"tone": "skromná", "t": ["Série je příjemná, ale vím, že jednou skončí. Důležitý je dnešní zápas, ne počítání.", "Snažím se k tomu přistupovat, jako by to byl první zápas týdne."], "pop": 0.15, "mom": 0.2, "jour": 1.1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Série není náhoda. Jsem ve formě a chci v ní pokračovat.", "Zastavit mě může jen ten, kdo zahraje líp. Dneska to hodlám ztížit."], "pop": 0.2, "mom": 0.55, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když to někdo zastaví, ať to aspoň udělá ve velkým stylu, ať máme o čem mluvit. Do tý doby jdu dál."], "pop": 0.18, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_streak_long", "when": "pre", "need": ["streakLong"], "qs": ["{streak} výher v řadě – to už je vidět i zvenku. Cítíš se neporazitelně?", "Taková šňůra se na okruhu jen tak nevidí. Kde bereš tu jistotu?", "Lidi začínají věřit, že tuhle sérii nikdo neukončí. Ty taky?"], "as": [{"tone": "skromná", "t": ["Neporazitelnej není nikdo. Já jenom teď dobře trénuju a dobře spím.", "Jistota je v práci, ne v pocitu. Ten pocit je nebezpečnej."], "pop": 0.2, "mom": 0.2, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Cítím se silně, to jo. A chci, aby ta šňůra ještě nějaký dny vydržela.", "Věřím si víc než kdy dřív. To je fakt."], "pop": 0.25, "mom": 0.6, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať přijde, kdo chce. Teď jsem ve stavu, kdy se mi prohrává jen těžko."], "pop": 0.15, "mom": 0.45, "jour": -0.3, "riv": 0, "spons": 0}]}, {"id": "pre_after_loss", "when": "pre", "need": ["afterLoss"], "qs": ["Minule to nevyšlo. Máš tu prohru ještě v hlavě, nebo už je pryč?", "Po prohře se často hraje křečovitě. Jak se z toho dneska dostaneš?", "Zklamání z posledního zápasu – bereš ho jako palivo, nebo jako zátěž?"], "as": [{"tone": "skromná", "t": ["Prohra bolela, ale poučil jsem se. Dneska chci bejt klidnější v klíčovejch míčcích.", "Je pryč, respektive je z ní lekce. Na kurt si beru jen tu lekci."], "pop": 0.12, "mom": 0.25, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Je to palivo. Dneska chci ukázat, že jedna prohra ze mě nedělá jinýho hráče.", "Už je pryč. Jdu si pro výhru, ne pro omluvu."], "pop": 0.15, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Minulej zápas rozebírat nechci. Dneska je jinej den a jinej soupeř."], "pop": 0, "mom": 0, "jour": -0.4, "riv": 0, "spons": 0}]}, {"id": "pre_form_good", "when": "pre", "need": ["formGood"], "qs": ["Vypadáš, že jsi ve formě. Cítíš to taky v tréninku?", "Míče ti poslední dobou odcházejí, jak chceš. Bojíš se, že to dneska zmizí?", "Když forma přijde, máš chuť ji hned zužitkovat. Platí to i dneska?"], "as": [{"tone": "skromná", "t": ["Forma je křehká, proto ji dneska nechci zahodit ledabylostí.", "Cítím se dobře, ale kurt to musí potvrdit."], "pop": 0.1, "mom": 0.25, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Jo, forma je tady a já ji chci zužitkovat právě dneska.", "Míče jdou, hlava je čistá. To je stav, ve kterým chci hrát pořád."], "pop": 0.15, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když forma přijde, neptám se jí na občanku. Prostě ji vezmu na kurt."], "pop": 0.18, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_form_bad", "when": "pre", "need": ["formBad"], "qs": ["Poslední týdny ti to úplně nešlo. Jak z toho ven?", "Forma je dole. Hledáš změny v tréninku, nebo v hlavě?", "Kritici už píšou o krizi. Bereš to vážně, nebo je to přestřelené?"], "as": [{"tone": "skromná", "t": ["Není to ideální, to přiznám. Pracujeme na drobnostech a věřím, že se to zlomí.", "Změny jsou v obojím, v hlavě i v práci. Krize je velký slovo, ale spokojenej nejsem."], "pop": 0.1, "mom": 0.2, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Krize to není. Špatný období na okruhu potká každého a já z něj vyjdu silnější.", "Dneska to můžu zlomit jedním zápasem. A přesně to chci."], "pop": 0.15, "mom": 0.45, "jour": 0.3, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si píšou o krizi. Já vám ji dneska možná přepíšu výsledkem."], "pop": 0.1, "mom": 0.35, "jour": -0.5, "riv": 0, "spons": 0}]}, {"id": "pre_inj_you", "when": "pre", "need": ["injYou"], "qs": ["Neníš úplně zdravý. Je rozumné dneska nastoupit?", "Zranění o tobě ví i soupeř. Neobáváš se, že to bude zkoušet?", "Tělo není na sto procent. Jak moc to dneska ovlivní tvůj tenis?"], "as": [{"tone": "skromná", "t": ["Kdybych nemohl hrát, nestojím tady. Trochu to cítím, ale rozhodnutí padlo a jdu do toho.", "Nejsem na sto, proto budu hrát chytře, ne zběsile."], "pop": 0.1, "mom": -0.1, "jour": 1.1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Bolí to, ale hlava je v pořádku a to dneska stačí k boji.", "Soupeř ať zkouší, co chce. Já vím, co moje tělo unese."], "pop": 0.12, "mom": 0.3, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["O zdraví se bavit nechci, to nechám týmu. Já jdu hrát."], "pop": 0, "mom": 0, "jour": -0.6, "riv": 0, "spons": 0}]}, {"id": "pre_inj_opp", "when": "pre", "need": ["injOpp"], "qs": ["{opp} není úplně v pořádku. Mění to tvůj přístup k zápasu?", "Soupeř má zdravotní otazník. Budeš na to tlačit, nebo se tím nechceš zabývat?", "Někteří by v takové situaci šli po těle. Ty taky?"], "as": [{"tone": "skromná", "t": ["To je jeho věc. Já připravuju svůj plán, jako by byl zdravý.", "Nepůjdu po zranění, půjdu po tenisu. To je jediný férovej přístup."], "pop": 0.15, "mom": 0, "jour": 1.5, "riv": -0.2, "spons": 0}, {"tone": "sebevědomá", "t": ["Když není ve své kůži, je to součást zápasu. Já svoje šance využiju.", "Připravený jsem na obojí – na zdravýho i na omezenýho soupeře."], "pop": 0, "mom": 0.3, "jour": -0.3, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Okruh nikoho nečeká. Kdo nastoupí, musí počítat s tím, že to bude tvrdé."], "pop": 0.05, "mom": 0, "jour": -1, "riv": 0.4, "spons": 0}]}, {"id": "pre_energy_low", "when": "pre", "need": ["energyLow"], "qs": ["Máš za sebou náročný týden a energie není nekonečná. Stačí ti dneska síly?", "Únava je vidět. Neobáváš se, že ve třetím setu dojde benzín?", "Jak se dneska chceš šetřit, abys zápas dohrál ve své síle?"], "as": [{"tone": "skromná", "t": ["Síly hlídám, proto budu vybírat výměny a šetřit zbytečné sprinty.", "Benzín není plnej, proto musím hrát chytře. To je dneska klíč."], "pop": 0, "mom": 0.1, "jour": 0.9, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Únava je u všech. Já mám vůli a tu dneska postavím před únavu.", "Dohrát to ve své síle chci, a umím to i na rezervu."], "pop": 0.1, "mom": 0.35, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Kdybych měl za každou zívnutí dolar, sponzora nepotřebuju. Ale na kurtu zívat nebudu."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "pre_underdog", "when": "pre", "need": ["underdog"], "qs": ["Kurzy z tebe dělají outsidra proti {opp}. Štve tě to, nebo nabíjí?", "Sázkaři ti moc nevěří. Máš chuť jim ten lístek překazit?", "Outsider má volnější ruce. Cítíš to jako výhodu?"], "as": [{"tone": "skromná", "t": ["Kurzy jsou jejich věc. Já jdu hrát a uvidíme, kdo měl pravdu.", "Outsider ať jsem, hlavně ať nejsem křeč."], "pop": 0.12, "mom": 0.25, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Sázkaři se často pletou a já jim s tím rád pomůžu.", "Volnější ruce jo – a zároveň chuť dokázat, že papír není tenis."], "pop": 0.2, "mom": 0.55, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si vsadí, na koho chtějí. Já tady nejsem od toho, abych jim vyplácel tikety."], "pop": 0.15, "mom": 0.4, "jour": 0.2, "riv": 0, "spons": 0}]}, {"id": "pre_favorite", "when": "pre", "need": ["favorite"], "qs": ["Jsi jasný favorit. Tlak očekávání, nebo příjemné potvrzení formy?", "Kurz na tebe je krátký. Cítíš povinnost vyhrát, nebo svobodu hrát?", "Favorit nemá co získat a spoustu co ztratit. Myslíš na to?"], "as": [{"tone": "skromná", "t": ["Favorit je jen slovo. Povinnost mám jen vůči svýmu výkonu.", "Na to nemyslím. Jdu hrát poctivě, ať je kurz jakej chce."], "pop": 0.1, "mom": 0.15, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Krátký kurz je proto, že jsem na to má. Chci to potvrdit.", "Povinnost vyhrát beru. Proto tu jsem."], "pop": 0.12, "mom": 0.4, "jour": -0.2, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když prohraju, budete psát o překvapení. Když vyhraju, že to bylo jasný. Takže já si zahraju a vy si napište, co chcete."], "pop": 0.18, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_odds_talk", "when": "pre", "need": [], "qs": ["Sleduješ před zápasem kurzy, nebo se tomu vyhýbáš?", "Lidi kolem sázejí velký peníze na váš zápas. Cítíš z toho tíhu?", "Živé sázky běží už před prvním podáním. Vadí ti, že je tenis i o tiketech?"], "as": [{"tone": "skromná", "t": ["Kurzy nesleduju. To je svět, do kterýho jako hráč nechci sahat.", "Tíhu z toho necítím, hraju svůj zápas, ne jejich tiket."], "pop": 0.1, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Kdybych koukal na kurzy, zblázním se dřív než z returnu. Tak to nechávám lidem v hledišti.", "Tenis je o míčku. Tikety ať řeší, kdo chce, já řeším první servis."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si sázejí. Já nejsem jejich zaměstnanec."], "pop": 0.08, "mom": 0, "jour": 0.2, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["O sázkách se bavit nechci, to k hráči nepatří."], "pop": 0, "mom": 0, "jour": 0.5, "riv": 0, "spons": 0}]}, {"id": "pre_sponsor", "when": "pre", "need": ["hasSponsor"], "qs": ["Sponzoři tě teď vidí víc. Cítíš, že musíš hrát i za loga na triku?", "Daří se ti a značky se hlásí. Nechává tě to v klidu, nebo přemýšlíš o obrazu?", "Když vyhraješ, mají radost i lidi, kteří tě oblékají. Myslíš na ně před zápasem?"], "as": [{"tone": "skromná", "t": ["Jsem vděčnej za podporu, ale na kurtu hraju za sebe a za tým, ne za logo.", "Obraz přijde z výkonu. Když zahraju poctivě, potěší to všechny."], "pop": 0.1, "mom": 0, "jour": 1, "riv": 0, "spons": 0.4}, {"tone": "sebevědomá", "t": ["Sponzoři šli do mě proto, že vyhrávám. Dneska chci, aby viděli, že vsadili dobře.", "Myslím na výkon. Když bude výkon, bude radost i na jejich straně."], "pop": 0.12, "mom": 0.3, "jour": 0, "riv": 0, "spons": 0.5}, {"tone": "vtipná", "t": ["Logo ať se na triku třpytí, já ať se na kurtu nezpotím jen z nervozity. To je férová dohoda."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0.2}]}, {"id": "pre_fix_rumor", "when": "pre", "need": ["fixRumor"], "qs": ["Kolem sázkového trhu se mluví o divných pohybech. Chceš se k tomu vyjádřit?", "Objevují se řeči o ovlivňování. Jak se ti v takovém šumu hraje?", "Integritní jednotka tenisu prý některé zápasy sleduje bedlivěji. Cítíš z toho nepříjemný tlak?"], "as": [{"tone": "skromná", "t": ["Já hraju poctivě a o trhu nic nevím. Jestli někdo škodí sportu, ať to vyšetří ti, kdo to hlídat mají.", "Šum je nepříjemnej, ale na kurtu se soustředím jen na tenis. Moje svědomí je čistý."], "pop": 0.15, "mom": 0, "jour": 1.5, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Takový řeči jsou špína, která se lepí i na ty, kteří s tím nemají nic společnýho. Mě to štve.", "Ať si to vyšetří pořádně, ať se přestane házet špína po všech."], "pop": 0.1, "mom": 0, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["K tomu se vyjadřovat nebudu. Nechci krmit řeči, který nepatří k mému zápasu."], "pop": 0, "mom": 0, "jour": -0.8, "riv": 0, "spons": 0}]}, {"id": "pre_press_good", "when": "pre", "need": ["pressGood"], "qs": ["S novináři vycházíš poslední dobou dobře. Je to záměr, nebo náhoda?", "Média tě berou spíš vlídně. Pomáhá ti to, nebo je to jedno?", "Citáty z tvých tiskovek se čtou rády. Dáváš si na nich záležet?"], "as": [{"tone": "skromná", "t": ["Snažím se odpovídat lidsky, ne na efekt. Když to vychází, jsem rád.", "Náhoda to není úplně, beru vás jako součást práce. Pomáhá to, když je klid."], "pop": 0.1, "mom": 0, "jour": 1.6, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když jsem vlídnej, napíšete, že jsem vyzrál. Když jsem ostřejší, že mám náladu. Tak volím vlídnost, je to pohodlnější."], "pop": 0.15, "mom": 0, "jour": 1.4, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Dávám si záležet, protože vím, že slovo taky něco váží. Ale stejně rozhoduje kurt."], "pop": 0.1, "mom": 0.15, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "pre_press_bad", "when": "pre", "need": ["pressBad"], "qs": ["Vztah s novináři je teď spíš chladný. Chceš to dneska napravit, nebo je to jedno?", "Poslední tiskovky byly ostřejší. Nelituješ něčeho, co padlo?", "Některé titulky ti poslední dobou nesedí. Chceš se k tomu vrátit?"], "as": [{"tone": "skromná", "t": ["Nechci mít s nikým zlou krev. Když jsem byl ostřejší, bylo to z emocí, ne z neúcty.", "Napravit se to dá jen slušnou odpovědí a slušným výkonem. Obojí dneska zkusím."], "pop": 0.1, "mom": 0, "jour": 2, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Titulky ať si žijou svým životem. Já žiju tenisem a do každého slova se strefit nejde.", "Nelituju. Někdy je potřeba říct věci natvrdo."], "pop": 0.05, "mom": 0, "jour": -1.2, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["K titulků se vracet nechci. Dneska je na stole zápas, ne starý citáty."], "pop": 0, "mom": 0, "jour": -0.3, "riv": 0, "spons": 0}]}, {"id": "pre_young_opp", "when": "pre", "need": ["youngOpp"], "qs": ["{opp} je mladší a hraje odvázaně. Neleze ti do hlavy ta bezstarostnost?", "Proti mladšímu soupeři se špatně hledá recept, protože nemá strach. Souhlasíš?", "Je to generační souboj, nebo jen další jméno v losu?"], "as": [{"tone": "skromná", "t": ["Mladí hrají volně a to je nebezpečný. Musím bejt trpělivej a počkat na jejich chyby.", "Generace je jedno, na kurtu jsme dva kluci s raketama."], "pop": 0, "mom": 0.15, "jour": 0.9, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Bezstarostnost je hezká, dokud nenarazí na zkušenost. Tu dneska mám já.", "Není to generační válka. Já chci vyhrát, on taky, a já vím jak."], "pop": 0.1, "mom": 0.45, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když začne létal balony po čarách, vzpomenu si, že jsem taky takovej bejval. Pak si vzpomenu, že chci vyhrát."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "pre_older_opp", "when": "pre", "need": ["olderOpp"], "qs": ["{opp} má víc kilometrů v nohách i v hlavě. Respektuješ tu zkušenost?", "Proti zkušenějšímu soupeři se často hraje o trpělivost. Máš ji?", "Veteráni umí krást zápasy v šatně i na kurtu. Čím ho chceš překvapit?"], "as": [{"tone": "skromná", "t": ["Zkušenost respektuju. Proto musím bejt důslednej a nenechat ho, aby mi zápas ukradl v koncovce.", "Trpělivost bude klíč. On počká, já nesmím spěchat."], "pop": 0, "mom": 0.2, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Kilometry má, ale nohy už taky nejsou ze železa. Dneska chci, aby to bylo o mých nohách.", "Překvapit ho chci tempem a odvahou. To zkušenost vždycky nerada vidí."], "pop": 0.12, "mom": 0.45, "jour": 0, "riv": 0.15, "spons": 0}, {"tone": "vtipná", "t": ["Když začne kroutit hlavou, budu vědět, že aspoň jeden míček dopadl, kam jsem chtěl."], "pop": 0.15, "mom": 0, "jour": 0.9, "riv": 0, "spons": 0}]}, {"id": "post_won_gen", "when": "post", "need": ["won"], "qs": ["Výhra je na tabuli. Jakou chuť má tenhle zápas?", "Zvládl jsi {opp} {score}. Co rozhodlo?", "Jsi v šatně jako vítěz. Co cítíš jako první – úlevu, nebo hlad po dalším?"], "as": [{"tone": "skromná", "t": ["Chuť je dobrá, ale vím, že to nebylo dokonalý. Rozhodla trpělivost v klíčovejch míčcích.", "Úleva i hlad. Jsem rád za výhru a už myslím na to, co opravit."], "pop": 0.25, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Rozhodla moje hlava a moje podání. Tohle byl zápas, kterej jsem chtěl řídit já.", "Hlad po dalším. Výhra je fajn, ale já chci jít dál v turnaji."], "pop": 0.3, "mom": 0.3, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Chuť má sladkou, i když jsem dvakrát málem zakopl o vlastní nohu. Tenis je krásnej i v tomhle."], "pop": 0.22, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Kdo čekal, že padnu, ať si to přepočítá. Dneska jsem byl lepší, tečka."], "pop": 0.15, "mom": 0, "jour": -0.4, "riv": 0.4, "spons": 0}]}, {"id": "post_lost_gen", "when": "post", "need": ["lost"], "qs": ["Prohra {score} proti {opp}. Kde se zápas zlomil?", "Co říkáš na dnešní výkon? Bolí víc výsledek, nebo způsob, jakým to padlo?", "Je něco, co bys dneska chtěl hrát jinak, kdyby šel čas vrátit?"], "as": [{"tone": "skromná", "t": ["Zlomilo se to v klíčovejch míčcích, tam byl {opp} jistější. Bolí způsob i výsledek.", "Chtěl bych bejt klidnější na returnu. Zítra se k tomu vrátíme s týmem."], "pop": 0.1, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Dneska to nestačilo, ale já vím, že můj tenis na takový zápasy má. Tohle není konec cesty.", "Vrátit čas nejde. Příště budu odvážnější, ne opatrnější."], "pop": 0.15, "mom": 0.15, "jour": 0.6, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Teď do toho nechci moc rýt, emoce jsou čerstvý. Nechám si to projít hlavou."], "pop": 0, "mom": 0, "jour": -0.3, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Kdyby šel čas vrátit, vyměním dva dvojchyby za dvě esa a jdeme pít kávu jako vítězové. Bohužel to tak nefunguje."], "pop": 0.12, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "post_close", "when": "post", "need": ["close"], "qs": ["Bylo to o fous, {score}. Věděl jsi ve špičkách, že to spadne na jednu dvě výměny?", "Takový zápas se pamatuje dýl než hladký. Co z něj si odnášíš?", "Nervy v koncovce – zvládls je, nebo tě málem položily?"], "as": [{"tone": "skromná", "t": ["Věděl jsem, že to visí na vlásku. Snažil jsem se dýchat a hrát jeden míč po druhým.", "Odnáším si, že i když to hoří, se dá zůstat ve hře, když se nezhroutíš."], "pop": 0.2, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["V koncovce jsem věřil, že to mám já. Ty nervy jsem chtěl mít pod kontrolou a měl.", "Takový zápasy vyhrávají hráči, který chtějí víc. Dneska jsem chtěl víc."], "pop": 0.25, "mom": 0.2, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Kolena mi klepala tak, že jsem se bál, že to uslyší první řada. Nakonec to nějak dopadlo."], "pop": 0.18, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_straight", "when": "post", "need": ["straight", "won"], "qs": ["Hladká výhra {score}. Bylo to tak snadné, jak to vypadá z tribuny?", "Soupeř se dneska skoro nedostal do zápasu. Čekal jsi takový průběh?", "Dva sety a hotovo. Šetřil jsi síly, nebo to prostě padalo?"], "as": [{"tone": "skromná", "t": ["Z tribuny to vypadá hladce, na kurtu to bylo o soustředění od začátku. Nic se nesmí usnout.", "Nečekal jsem kanára, čekal jsem boj. Že to šlo rychleji, beru s pokorou."], "pop": 0.18, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Dneska jsem byl prostě lepší ve všem důležitým. Takovej průběh jsem chtěl.", "Síly jsem nešetřil, já jsem tlačil. Proto to skončilo rychle."], "pop": 0.22, "mom": 0.2, "jour": 0.2, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Když jsem v takovýhle formě, je těžký proti mně něco vymyslet. To je dnešní pravda."], "pop": 0.12, "mom": 0, "jour": -0.4, "riv": 0.3, "spons": 0}]}, {"id": "post_straight_l", "when": "post", "need": ["straight", "lost"], "qs": ["Prohrál jsi na nulu ve setech. Co se dneska vůbec nestalo?", "{score} je tvrdý účet. Máš pro to vysvětlení, nebo jen zklamání?", "Soupeř tě nepustil do zápasu. Uzavřel ses, nebo on byl prostě jinde?"], "as": [{"tone": "skromná", "t": ["On byl dneska jinde, to musím uznat. Já jsem nenašel ritmus a trestalo se to hned.", "Je to zklamání. Vysvětlení je jednoduchý: nestačil jsem, tečka."], "pop": 0.08, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Jeden špatnej den. Neberu to jako verdikt o mý kvalitě, ale jako pohlavek, kterej mě má vzbudit.", "Uzavřel jsem se trochu, to jo. Příště z toho vypadnu dřív."], "pop": 0.1, "mom": 0, "jour": 0.6, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Dneska se mi o tom těžko mluví. Nechte mi chvilku, prosím."], "pop": 0, "mom": 0, "jour": -0.2, "riv": 0, "spons": 0}]}, {"id": "post_comeback", "when": "post", "need": ["comeback"], "qs": ["Prohrával jsi set a otočil jsi to. Kde se v tobě ta otočka vzala?", "Comeback {score}. Věřil jsi tomu i ve chvíli, kdy to vypadalo špatně?", "Taková otočka často změní sezónu v hlavě. Cítíš to?"], "as": [{"tone": "skromná", "t": ["Věřil jsem, že mám ještě prostor. Řekl jsem si, že budu hrát výměnu po výměně, nic víc.", "Vzala se z klidu. Jakmile jsem přestal panikařit, začaly padat míče."], "pop": 0.3, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Já v takových stavech věřím. Proto jsem to otočil, ne náhodou.", "Sezónu v hlavě to změní. Teď vím, že i ze špatný pozice dokážu vyjít."], "pop": 0.32, "mom": 0.35, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["V šatně bych vám v tu chvíli vsadil sprchu, že to ještě vezmu. Dobře, že sázky u hráčů neberou."], "pop": 0.22, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_upset_w", "when": "post", "need": ["upsetWin"], "qs": ["Porazil jsi favorita {opp}. Uvědomuješ si, jaký je to výsledek?", "Tohle je výhra, o který se bude psát. Čím jsi ho sklátil?", "Sázkaři na tebe nevěřili. Chceš jim něco vzkázat?"], "as": [{"tone": "skromná", "t": ["Uvědomuju, a jsem za to vděčnej. Sklátil jsem ho trpělivostí a pár odvážnejma míčkama, když to bylo potřeba.", "Je to velký výsledek, ale zítra začínáme znova. Pokora musí zůstat."], "pop": 0.45, "mom": 0, "jour": 1.5, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Věděl jsem, že na to mám, i když papír říkal něco jinýho. Dneska to padlo, jak mělo.", "Sázkařům nic nevzkazuju. Já tu nejsem pro jejich tikety, ale tahle výhra je moje."], "pop": 0.4, "mom": 0.3, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si příště ten papír přečtou ještě jednou. Favorit je jenom slovo.", "Někdo dneska odepsal špatně. Já jsem to přepsal na kurtu."], "pop": 0.3, "mom": 0, "jour": 0.2, "riv": 0.4, "spons": 0}]}, {"id": "post_upset_l", "when": "post", "need": ["upsetLoss"], "qs": ["Prohrál jsi jako favorit. Jak se s takovou prohrou žije?", "Papír tě měl za jistého vítěze a {opp} to potrhal. Co se stalo?", "Bolela dnešní prohra víc než jiné, právě proto, že všichni čekali tvou výhru?"], "as": [{"tone": "skromná", "t": ["Žije se s ní blbě, to nepředstírám. {opp} byl dneska lepší a já tomu nezvládl přizpůsobit hru.", "Bolela víc, jo. Očekávání je zrádný, když ho nepotvrdíš."], "pop": 0.08, "mom": 0, "jour": 1.4, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Je to pohlavek, ale já z něj vstanu. Jedna prohra z favorita ze mě nedělá horšího hráče.", "Stalo se, že on to chtěl víc a já jsem byl těžkopádnej. Příště to otočím."], "pop": 0.12, "mom": 0.15, "jour": 0.7, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať se radujou dnešní outsideri. Já si to budu pamatovat a příště to vrátím i s úrokama."], "pop": 0.05, "mom": 0, "jour": -0.6, "riv": 0.5, "spons": 0}]}, {"id": "post_ret_you", "when": "post", "need": ["retYou"], "qs": ["Skrečoval jsi. Chceš vysvětlit, co tě k tomu vedlo?", "Odchod ze zápasu vždycky vypadá těžce. Bylo to jen o těle, nebo i o hlavě?", "Lidi nemají skreč rádi, zvlášť když na něj měli tiket. Co bys jim vzkázal?"], "as": [{"tone": "skromná", "t": ["Tělo řeklo dost a já musel poslechnout. Není to zbabělost, je to ochrana kariéry.", "Bylo to o těle. Hlavou bych ještě šel, ale nohy a bolest by mě za to potrestaly."], "pop": 0.05, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Detaily nechám týmu a doktorům. Mě to mrzí vůči lidem na tribuně i vůči soupeři."], "pop": 0.05, "mom": 0, "jour": 0.4, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Radši skrečuju dneska, než abych vypadl na měsíc. To je rozhodnutí, za kterým si stojím.", "Lidem na tikety nic nedlužím. Dlužím to svýmu tělu a svý kariéře."], "pop": 0.0, "mom": 0, "jour": 0.2, "riv": 0, "spons": 0}]}, {"id": "post_ret_opp", "when": "post", "need": ["retOpp"], "qs": ["Soupeř skrečoval. Jaké to je postupovat bez dohraného zápasu?", "Výhra skrečí vždycky chutná jinak. Bereš ji, nebo ti chybí ten poslední míček?", "Přál jsi {opp} zdraví – a zároveň šel dál v turnaji. Jak se to v hlavě skládá?"], "as": [{"tone": "skromná", "t": ["Postup beru, ale chuť je hořkosladká. Přál bych si dohrát a zároveň mu přeju, ať je brzo v pořádku.", "Chybí mi ten poslední míček, to jo. Ale tabulka platí a já jdu dál."], "pop": 0.15, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Byl jsem v zápase dobře, a i kdyby dohrál, věřím, že bych to zvládnul. I tak mu přeju zdraví.", "Beru postup. Na okruhu se takhle taky vyhrává, bohužel."], "pop": 0.12, "mom": 0, "jour": 0.5, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Chtěl jsem vyhrát raketou, ne lékárničkou. Ale když už to tak je, jdu se připravit na další kolo."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "post_tb", "when": "post", "need": ["tb"], "qs": ["Tiebreak rozhodoval. Máš v něm dneska čisté svědomí?", "Zkrácená hra je loterie pro někoho, řemeslo pro jiného. Čím to dneska bylo?", "V tiebreaku se nejdřív zrychlí tep, pak míčky. Jak jsi to zvládl?"], "as": [{"tone": "skromná", "t": ["Svědomí mám, hrál jsem odvážně, i když s respektem. Byl to spíš řemeslo než loterie.", "Tep byl rychlej, to nepředstírám, ale míčky jsem chtěl trestat já."], "pop": 0.18, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Tiebreak je moje hra, když jsem v klidu. Dneska jsem v klidu byl.", "Nebyla to loterie. Byl to plán a dvě tři odvážný rozhodnutí."], "pop": 0.2, "mom": 0.15, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Manželka říká, ať v tiebreaku nedýchám ústy. Dneska jsem to skoro dodržel."], "pop": 0.16, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "post_title", "when": "post", "need": ["title"], "qs": ["Titul je tvůj! Uvědomuješ si to už, nebo ještě ne?", "Pojmenuj tenhle týden jedním slovem. A pak nám řekni, čím ho opravdu vyhrál.", "Když zvedneš trofej, na koho první myslíš?"], "as": [{"tone": "skromná", "t": ["Ještě úplně ne. Je to krásný a jsem vděčnej týmu, rodině i lidem, co mě chtěli vidět vyhrát. Vyhrál jsem to trpělivostí.", "Myslím na lidi, který se mnou byli, když to ještě nikam nevypadalo."], "pop": 0.6, "mom": 0, "jour": 1.8, "riv": 0, "spons": 0.5}, {"tone": "sebevědomá", "t": ["Uvědomuju. Šel jsem si pro to od prvního kola a dneska je to splněný.", "Jedním slovem: zaslouženě. Vyhrál jsem to tím, že jsem v těžkejch chvílích nevypnul."], "pop": 0.55, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0.4}, {"tone": "vtipná", "t": ["Jedním slovem: konečně. A na koho myslím? Na fyzioterapeuta a na večeři, v tomhle pořadí."], "pop": 0.4, "mom": 0, "jour": 1.5, "riv": 0, "spons": 0.3}]}, {"id": "post_next", "when": "post", "need": ["nextRound", "won"], "qs": ["V dalším kole čeká {next}. Už na něj myslíš, nebo si necháš noc jen pro dnešek?", "Postup máš, ale kalendář je neúprosný. Jak rychle přepínáš na další zápas?", "Je další kolo odměna, nebo další zkouška, na kterou ještě nemáš hlavu?"], "as": [{"tone": "skromná", "t": ["Nechám si večer na radost a ráno začneme připravovat další plán. Teď bych nic chytrýho o {next} neřekl.", "Přepínám pomalu. Tělo musí nejdřív dojít, hlava potom."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Už na něj koukám. Chci jít dál a {next} je další schod, kterej chci vyjít.", "Je to zkouška i odměna. Já beru obojí."], "pop": 0.15, "mom": 0.25, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["O dalším kole se bavme, až se vyspím. Dneska je tohle dost."], "pop": 0, "mom": 0, "jour": -0.2, "riv": 0, "spons": 0}]}, {"id": "post_out_early", "when": "post", "need": ["outEarly", "lost"], "qs": ["Padl jsi dřív, než jsi chtěl. Je to ztráta týdne, nebo poučení?", "Brzký konec na turnaji bolí. Co si z něj odvážíš?", "Čekal jsi od tohohle týdne víc. Kde se to rozpadlo?"], "as": [{"tone": "skromná", "t": ["Je to poučení, i když to bolí. Rozpadlo se to v detailech, který teď musíme spravit.", "Odvážím si práci na návratu. Týden není ztracenej, když z něj něco vytáhneš."], "pop": 0.1, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Čekal jsem víc, to jo. Ale já se z takovejhle konců umím odrazit, to už jsem ukázal.", "Není to verdikt. Je to zastávka, ze který pojedu dál."], "pop": 0.12, "mom": 0.15, "jour": 0.6, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Pište, že jsem zklamal. Já vám to v příštím týdnu třeba vrátím i s úrokama."], "pop": 0.05, "mom": 0, "jour": -0.7, "riv": 0.2, "spons": 0}]}, {"id": "post_serve_day", "when": "post", "need": ["serveDay"], "qs": ["Servis ti dneska seděl mimořádně. Cítil jsi to už na rozehrávce?", "Esa padala jedna za druhou. Je to dnešní forma, nebo nová zbraň na delší dobu?", "Soupeř na tvé podání dneska skoro neměl odpověď. Čím to bylo?"], "as": [{"tone": "skromná", "t": ["Cítil jsem to už na rozehrávce, ale i dobrý servis se musí udržet. Nic z toho nepřeženu.", "Byla to dnešní forma. Když to zůstane i příště, budu rád, ale pokora zůstává."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Servis je moje zbraň a dneska byla nabitá. Chci, aby to tak zůstalo.", "Neměl odpověď, protože jsem mu nenechal rytmus. Přesně tak to chci hrát."], "pop": 0.2, "mom": 0.2, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když jde první servis tam, kam ukážu, jsem najednou mnohem hezčí hráč. Dneska šel."], "pop": 0.16, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "post_ue_day", "when": "post", "need": ["manyUE"], "qs": ["Nevynucených chyb bylo víc než obvykle. Čím to bylo?", "Dneska ti to z rakety občas odcházelo samo. Hledáš příčinu v technice, nebo v hlavě?", "Soupeř tě trestal za dary. Štve tě víc ten účet, nebo ty chyby samotný?"], "as": [{"tone": "skromná", "t": ["Bylo to víc v hlavě než v ruce. Spěchal jsem a dary se trestaly. To musím uklidit.", "Štve mě obojí, ale víc ty chyby. Účet je jen jejich následek."], "pop": 0.08, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Dneska to z rakety odcházelo, jo. Zítra to uklidíme a já vím, že můj standard je jinde.", "Příčina je v netrpělivosti. Tu dokážu spravit rychle."], "pop": 0.1, "mom": 0.1, "jour": 0.6, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Kdybych dostal dolar za každou nevynucenou, sponzora fakt nepotřebuju. Bohužel to funguje naopak."], "pop": 0.12, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "post_long_rally", "when": "post", "need": ["longRally"], "qs": ["Padaly tu výměny, u kterých tribuna držela dech. Bavilo tě to, nebo vysávalo?", "Nejdelší výměna dneška bude v sestřizích. Cítil jsi v ní zlom zápasu?", "Takový bitvy v základu rozhodují o charakteru. Čí charakter dneska vyhrál?"], "as": [{"tone": "skromná", "t": ["Bavilo i vysávalo. V tý nejdelší jsem si řekl, že prostě přetrvám, a to možná zápas zlomilo.", "Charakter vyhrál ten, kdo v tý výměně zůstal trpělivejší. Dneska to tak cítím."], "pop": 0.2, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Takový výměny chci hrát a vyhrávat. Dneska byl ten charakter můj.", "Zloms zápasu? Jo. Když jsem tu nejdelší uhrál, věděl jsem, že tohle utkání je moje."], "pop": 0.22, "mom": 0.15, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Po tý nejdelší jsem hledal kyslík i smysl života. Naštěstí oboje ještě bylo na kurtu."], "pop": 0.18, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_home", "when": "post", "need": ["home"], "qs": ["Domácí publikum tě dneska neslo. Chceš jim něco vzkázat?", "Hrálo se u vás. Cítil jsi tu podporu i v těžkých chvílích?", "Domácí zápas má jinou příchuť. Jaká byla dnešní?"], "as": [{"tone": "skromná", "t": ["Díky za každý hlas. V těžkejch chvílích to bylo slyšet a pomohlo to víc, než tušíte.", "Příchuť byla vřelá. I když to bylo těžký, cítil jsem, že tu nejsem sám."], "pop": 0.35, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Tohle je moje podlaha a moji lidi. Dneska jsem chtěl, aby šli domů hrdý.", "Podporu jsem cítil a já ji chtěl splatit výkonem."], "pop": 0.35, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když křičí moje jméno, jsem o dva kilometry v nohách silnější. Dneska křičeli dost, tak jsem došel až sem."], "pop": 0.25, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_rival", "when": "post", "need": ["rival"], "qs": ["Zase jste se potkali s {opp}. Změnilo dnešní utkání něco na vaší rivalitě?", "Po takovém zápase se buď podáte, nebo se ještě víc zaříznete. Jak to máš ty?", "Lidi tu rivalitu milují. Ty ještě taky, nebo už z ní jsi unavený?"], "as": [{"tone": "skromná", "t": ["Rivalita zůstává, ale dneska z ní chci mít hlavně respekt. Podám ruku vždycky.", "Nejsem z ní unavenej, ale nenechám se jí sežrat. Tenis je víc než jeden protivník."], "pop": 0.15, "mom": 0, "jour": 1.2, "riv": -0.2, "spons": 0}, {"tone": "sebevědomá", "t": ["Dnešek tu rivalitu spíš přiostřil. Já v ní chci bejt ten, kdo má poslední slovo.", "Miluju ji. Takový zápasy mě dělají lepším."], "pop": 0.2, "mom": 0.15, "jour": 0, "riv": 0.4, "spons": 0}, {"tone": "provokativní", "t": ["Ať si zvyká, že se mnou to bude tvrdý i příště. Tahle kapitola ještě není dopsaná.", "Unavenej z něj nejsem. Spíš hladovej po další odvetě."], "pop": 0.12, "mom": 0, "jour": -0.4, "riv": 0.7, "spons": 0}]}, {"id": "post_dc", "when": "post", "need": ["dc"], "qs": ["Davis Cup má jiný emoce. Jaké jsou ty tvoje teď po zápase?", "Hrál jsi za zemi. Cítíš, že jsi dresu dostál?", "Spoluhráči na lavičce viseli na každém míčku. Co jim chceš říct?"], "as": [{"tone": "skromná", "t": ["Emoce jsou velký, větší než v běžným týdnu. Snažil jsem se dresu dostát a doufám, že kluci to tak cítí.", "Chci jim říct díky. Bez lavičky bych tohle neutáhl."], "pop": 0.4, "mom": 0, "jour": 1.4, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Dresu jsem dostál. Dal jsem zemi to, co jsem měl, a jsem na to pyšnej.", "Kluci věděli, že to dneska utáhnu. Já to věděl taky."], "pop": 0.35, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Řeknu jim, ať mi v šatně nechaj vodu a ticho. Pak jim poděkuju, slibuju."], "pop": 0.25, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_sponsor", "when": "post", "need": ["hasSponsor"], "qs": ["Sponzoři dnešek sledovali z první řady. Máš pro ně vzkaz?", "Takový výkony dělají radost i značkám na tvém triku. Myslíš na to ve finiši?", "Obchodní partneři chtějí vidět charakter. Viděli ho dneska?"], "as": [{"tone": "skromná", "t": ["Díky za podporu. Doufám, že dnešek byl poctivej pohled na to, kdo jsem, i v dobrým i ve zlým.", "Ve finiši myslím na míček, ne na logo. Ale jsem rád, že se mnou jdou."], "pop": 0.12, "mom": 0, "jour": 1, "riv": 0, "spons": 0.5}, {"tone": "sebevědomá", "t": ["Charakter viděli. Já v těžkejch chvílích neutíkám, a to je přesně to, s čím ke mně šli.", "Vzkaz je jednoduchý: držím, co slíbím, na kurtu i mimo."], "pop": 0.15, "mom": 0, "jour": 0.8, "riv": 0, "spons": 0.6}, {"tone": "vtipná", "t": ["Vzkaz je, ať mi ještě chvíli věří, i když občas zahraju bekhend do plotu. Dneska snad plot vydržel."], "pop": 0.12, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0.35}]}, {"id": "post_fix", "when": "post", "need": ["fixRumor"], "qs": ["O zápase se předem mluvilo v souvislosti s podezřelými sázkami. Chceš to po utkání nějak uzavřít?", "Hrálo se pod zvláštnim dohledem řečí. Ovlivnilo to tvoje chování na kurtu?", "Je něco, co bys vzkázal lidem, kteří v tom hledali skandál místo tenisu?"], "as": [{"tone": "skromná", "t": ["Hrál jsem poctivě od prvního míčku do posledního. Kdo v tom hledal skandál, ať se podívá na záznam, ne na řeči.", "Neovlivnilo. Já mám čistou hlavu a čistý zápas, to je vše, co k tomu řeknu."], "pop": 0.15, "mom": 0, "jour": 1.6, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Skandál si hledejte jinde. Já sem přišel hrát tenis a to jsem taky udělal.", "Ty řeči jsou laciný. Výsledek je na tabuli a já si za ním stojím."], "pop": 0.08, "mom": 0, "jour": 0.6, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Uzavřít to můžou ti, kdo to mají vyšetřovat. Já uzavírám jen svůj zápas."], "pop": 0, "mom": 0, "jour": 0.2, "riv": 0, "spons": 0}]}, {"id": "post_jour_quote", "when": "post", "need": [], "qs": ["Jaký citát máme z dneška odnést do novin?", "Jedna věta, která vystihuje tvůj dnešní den. Zkusíš to?", "Až ráno vyjde Tenisový deník, co bys v něm chtěl číst o sobě?"], "as": [{"tone": "skromná", "t": ["Ať tam stojí, že jsem bojoval poctivě a že si vážím každého, kdo to došel až do konce.", "Jedna věta: dal jsem, co jsem měl, a beru, co z toho je."], "pop": 0.15, "mom": 0, "jour": 1.4, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Ať tam stojí, že jsem dnešek vzal do svých rukou.", "Chtěl bych číst, že jsem ukázal charakter, když to bylo těžký."], "pop": 0.15, "mom": 0, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Napište, že jsem to přežil, že míček je pořád kulatej a že zítra jdu zase na kurt. Víc netřeba.", "Citát: Každej zápas je román, dnešek měl hodně korekcí."], "pop": 0.18, "mom": 0, "jour": 1.5, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["Citáty nechám na vás. Já už bych teď nejradši jenom sprchu."], "pop": 0, "mom": 0, "jour": -0.3, "riv": 0, "spons": 0}]}, {"id": "pre_weather", "when": "pre", "need": [], "qs": ["Podmínky jsou dneska svý. Vítr, slunce, teplota – řešíš to, nebo jen bereš, co je?", "Hráči často vymlouvají výkon na počasí. Ty máš nějakou hranici, kdy už to vadí?", "Jsi typ, který ráno honí každý mrak, nebo jdeš na kurt a hraješ v tom, co přijde?"], "as": [{"tone": "skromná", "t": ["Beru, co je. Přizpůsobit se podmínkám patří k řemeslu, ne k výmluvám.", "Hranici mám jen u bezpečí. Jinak hraju, ať fouká nebo praží."], "pop": 0, "mom": 0.1, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Podmínky jsou stejný pro oba. Já se v nich chci vyznat rychlejc.", "Mraky nehoním. Jdu na kurt a hraju svůj tenis."], "pop": 0, "mom": 0.3, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když fouká, hraju níž. Když praží, piju víc. To je celá moje meteorologie."], "pop": 0.15, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_stats", "when": "pre", "need": [], "qs": ["Sleduješ před zápasem statistiky soupeře, nebo jdeš víc po pocitu?", "Čísla říkají jedno, kurt druhý. Čemu dneska věříš víc?", "Trenér ti jistě nosí grafy. Máš z nich užitečnou radu, nebo tě spíš zahltí?"], "as": [{"tone": "skromná", "t": ["Kouknu na čísla, ale rozhoduju se podle toho, co cítím v rozehrávce. Grafy jsou pomoc, ne předpis.", "Věřím víc kurtu. Statistiky jsou včerejšek."], "pop": 0, "mom": 0.15, "jour": 0.8, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Čísla znám a vím, kde ho musím trestat. Dneska z toho bude plán, ne pocit.", "Rada z grafů je jasná a já ji hodlám použít."], "pop": 0.08, "mom": 0.35, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když mi trenér přinese tři stránky, zeptám se ho na jednu větu. Když ji má, jdeme na kurt."], "pop": 0.14, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "pre_family", "when": "pre", "need": [], "qs": ["Rodina dnešek sleduje. Cítíš je v zádech, i když jsou třeba daleko?", "Komu první napíšeš až po zápase, ať dopadne jak dopadne?", "Bez zázemí se na okruhu blbě žije. Pomáhá ti vědomí, že na tebe někdo čeká?"], "as": [{"tone": "skromná", "t": ["Cítím je vždycky. První napíšu domů, ať je to výhra nebo prohra.", "Zázemí je základ. Bez něj bych tyhle týdny neutáhl."], "pop": 0.2, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Vím, že mě sledujou, a chci, aby měli radost. To mě žene.", "Napíšu domů výhru. To je plán."], "pop": 0.15, "mom": 0.2, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["První napíšu mámě, protože kdybych nenapsal, volala by dřív, než dojdu do sprchy."], "pop": 0.18, "mom": 0, "jour": 1.3, "riv": 0, "spons": 0}]}, {"id": "pre_atp", "when": "pre", "need": ["atp"], "qs": ["Turnaj ATP už má jiný lesk než nižší okruh. Užíváš si ho?", "Tady jsou šatny větší a tlak taky. Čemu si zvykáš rychlejc?", "Na okruhu ATP se body i peníze počítají jinak. Mění to tvůj přístup k jednomu zápasu?"], "as": [{"tone": "skromná", "t": ["Užívám, ale s pokorou. Tlak je větší, proto musím bejt ještě věcnější.", "Přístup neměním. Jeden zápas je pořád jeden zápas, ať je dotace jaká chce."], "pop": 0.12, "mom": 0.15, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Tohle je prostředí, kam chci patřit natrvalo. Dneska to chci potvrdit.", "Zvykám si na tlak rychlejc než na větší šatny. To je dobře."], "pop": 0.15, "mom": 0.4, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Větší šatny, stejný nervy, dražší káva. Jinak je to pořád tenis."], "pop": 0.15, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "post_first_set", "when": "post", "need": ["won"], "qs": ["První set ti sedl. Byl to klíč k celému zápasu?", "Jak důležitý bylo, že jsi dneska odstartoval lépe než soupeř?", "Když vezmeš první set, změní se v hlavě spousta věcí. Cítil jsi to?"], "as": [{"tone": "skromná", "t": ["První set mi dal klid, to jo. Ale zápas se musí dohrát, proto jsem nesměl usnout.", "Odstartovat líp pomohlo. Pak už šlo o to, udržet tu jistou ruku."], "pop": 0.12, "mom": 0, "jour": 0.9, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Jo, první set byl klíč. Jakmile jsem ho vzal, věděl jsem, že zápas řídím já.", "V hlavě se to změnilo. Najednou jsem byl ten, kdo diktuje."], "pop": 0.15, "mom": 0.15, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vyhýbavá", "t": ["O jednotlivých setech teď moc mluvit nechci, beru celek."], "pop": 0, "mom": 0, "jour": -0.2, "riv": 0, "spons": 0}]}, {"id": "post_crowd_away", "when": "post", "need": ["away"], "qs": ["Tribuna dneska až tak s tebou nebyla. Zvládls to v hlavě?", "Venkovní publikum umí bejt jedovatý. Slyšel jsi to, nebo ses zavřel?", "Pomohlo ti dneska, že už máš s cizími tribunami zkušenost?"], "as": [{"tone": "skromná", "t": ["Slyšel jsem to, ale nesměl jsem na to přistoupit. Zkušenost pomohla, to jo.", "Zavřel jsem se do svého rytmu. To je jediná obrana venku."], "pop": 0.12, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Jedovatý publikum mě spíš nabudí. Dneska to tak bylo.", "Zvládnul. Venku chci umět vyhrávat, to je známka velkýho hráče."], "pop": 0.15, "mom": 0.15, "jour": 0, "riv": 0, "spons": 0}, {"tone": "provokativní", "t": ["Ať si křičí, co chtějí. Já stejně odcházím se svým výsledkem."], "pop": 0.1, "mom": 0, "jour": -0.3, "riv": 0, "spons": 0}]}, {"id": "post_coach", "when": "post", "need": [], "qs": ["Co ti trenér řekl cestou do šatny? Můžeš z toho něco prozradit?", "Jak moc je dnešní výsledek i práce týmu, nejen tvoje?", "Trenéři po zápase buď kroutí hlavou, nebo tleskají. Co dělal ten tvůj?"], "as": [{"tone": "skromná", "t": ["Řekl mi, ať nehodnotím hned a napiju se. Výsledek je vždycky práce týmu, bez nich bych tu nebyl.", "Kroutil i tleskal, typicky. Má pravdu v obojím."], "pop": 0.12, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Řekl, že to byl můj zápas, když jsem vydržel v plánu. Tým odvedl svoje, já svoje.", "Dneska spíš tleskal. Zaslouženě, odmakali jsme to spolu."], "pop": 0.12, "mom": 0, "jour": 0.7, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Řekl mi větu, kterou nesmím citovat, protože by z ní byl titulek a já bych musel ráno běhat. Takže jen: bylo to věcný."], "pop": 0.14, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_night", "when": "post", "need": [], "qs": ["Budeš dneska dlouho usínat, nebo tě zápas naopak uspí?", "Co je teď první věc, kterou chceš udělat, až opustíš areál?", "Po takovém dni se špatně vypíná hlava. Máš na to svůj recept?"], "as": [{"tone": "skromná", "t": ["Hlava se vypíná pomalu, to je fakt. Recept je jídlo, sprcha a zítra čistý stůl.", "První věc? Napsat domů a najít klidný kout."], "pop": 0.1, "mom": 0, "jour": 0.9, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Usnu, protože vím, že jsem na kurtu nechal všechno. To je nejlepší usínání.", "První věc je odpočinek, druhá příprava na další den. V tomhle pořadí."], "pop": 0.1, "mom": 0.1, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Recept je blbý seriál a velký jídlo. Kdybych přiznal, který seriál, ztratil bych image borce."], "pop": 0.16, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "pre_h2h_even", "when": "pre", "need": ["h2hEven"], "qs": ["Vzájemně to máte {h2h}, vyrovnané jako na váhách. Co dneska tu váhu překlopí?", "Historie mezi vámi je těsná. Čekáš zase drama, nebo chceš dneska utéct?", "Když je bilance vyrovnaná, každý další zápas má větší váhu. Cítíš ji?"], "as": [{"tone": "skromná", "t": ["Překlopí to trpělivost v koncovce. Drama čekat můžu, ale chtěl bych se mu vyhnout dobrou hrou.", "Váhu cítím, proto musím bejt věcnej, ne oslavnej."], "pop": 0, "mom": 0.2, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Dneska tu váhu překlopím já. Chci utéct, ne hrát další thriller.", "Vyrovnaná bilance skončí ve chvíli, kdy zahraju svoje celé odpoledne."], "pop": 0.1, "mom": 0.45, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když to zase půjde do tretejho, ať aspoň v šatně nechají studenou vodu. Minule došla."], "pop": 0.15, "mom": 0, "jour": 1, "riv": 0, "spons": 0}]}, {"id": "post_qual_done", "when": "post", "need": ["qual", "won"], "qs": ["Kvalifikaci máš za sebou, hlavní soutěž před sebou. Jak chutná ten průchod branou?", "Mnozí v kvalifikaci padnou na posledním kroku. Ty jsi ho udělal. Úleva?", "Hlavní soutěž je jiná šatna, jiný kurt, jiný oči. Těšíš se, nebo už cítíš únavu?"], "as": [{"tone": "skromná", "t": ["Chuť je dobrá a úleva taky. Teď ale začíná teprve to, kvůli čemu jsem tu.", "Únavu cítím, proto musím chytře regenerovat. Těším se, to jo."], "pop": 0.25, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Bránu jsem chtěl otevřít a otevřel. Teď chci v hlavní soutěži ukázat víc.", "Úleva je, ale hlad je větší. Jdu dál."], "pop": 0.22, "mom": 0.2, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Chutná to jako pořádná večeře po třech snídaních v pět ráno. Konečně hlavní stůl."], "pop": 0.18, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}, {"id": "pre_first_title_chase", "when": "pre", "need": ["final", "noTitle"], "qs": ["Můžeš získat první titul v kariéře. Uvědomuješ si tu větu?", "Takový finále se pamatuje celý život, ať dopadne jak dopadne. Jak s tím spíš?", "Lidi doma už ti ten titul skoro připsali. Neleze ti to do hlavy?"], "as": [{"tone": "skromná", "t": ["Uvědomuju a zároveň to musím zahnat. Je to zápas, ne ceremoniál.", "Spí se mi neklidně, to jo. Ale do hlavy si to pustit nenechám."], "pop": 0.25, "mom": 0.2, "jour": 1.3, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Uvědomuju a chci si ho vzít. Na tohle jsem dělal celou cestu.", "Ať mi ho připsali, nebo ne, já si ho musím vyhrát. A to hodlám."], "pop": 0.3, "mom": 0.5, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Kdybych na to myslel celou noc, ráno bych bral raketu obráceně. Tak myslím na snídani a na první podání."], "pop": 0.2, "mom": 0, "jour": 1.2, "riv": 0, "spons": 0}]}, {"id": "post_many_aces_df", "when": "post", "need": ["serveMixed"], "qs": ["Esa i dvojchyby, obojího bylo dneska dost. Jak si vysvětluješ tu houpačku?", "Servis ti někdy sloužil jako meč a někdy jako past. Kde byla hranice?", "Risk na podání se dneska vyplácel i nevyplácel. Příště ubereš, nebo ještě přidáš?"], "as": [{"tone": "skromná", "t": ["Houpačka byla v tom, že jsem chtěl moc. Hranice je v klidu v ruce, tu jsem občas ztratil.", "Příště uberu jen hloupý risk, ne odvahu. To je rozdíl."], "pop": 0.1, "mom": 0, "jour": 1, "riv": 0, "spons": 0}, {"tone": "sebevědomá", "t": ["Radši taková houpačka než bojácný druhé podání. Příště přidám ještě přesnost, ne opatrnost.", "Meč i past, jo. Já chci, aby ten meč převažoval, a vím jak."], "pop": 0.12, "mom": 0.1, "jour": 0, "riv": 0, "spons": 0}, {"tone": "vtipná", "t": ["Když vyšlo eso, byl jsem hrdina. Když dvojchyba, hrdina z minulý věty. Tenis je rychlej soudce."], "pop": 0.14, "mom": 0, "jour": 1.1, "riv": 0, "spons": 0}]}];

function classifyChat(m,r){

function isLiveSetPoint(m){

 // next point wins the set?

 if(m.tb){const t=m.tbT||7;return m.pt[iLead]>=t-1&&m.pt[iLead]>m.pt[1-iLead];}

}

.paper-sheet{max-width:800px;margin:0 auto;padding:12px 18px;background:#f6efd9;color:#1a160e}

function printNewspaper(id){
 const p=findPaper(id);if(!p)return;
 const body=paperSheetHTML(p,true);
 const html='<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+(p.title||'Tenisový deník')+'</title><style>'+PAPER_PRINT_CSS+'</style></head><body>'+body+'</body></html>';
 let w=null;try{w=window.open('','_blank','noopener,noreferrer,width=800,height=900');}catch(e){w=null;}
 if(w){w.document.open();w.document.write(html);w.document.close();setTimeout(function(){try{w.focus();w.print();}catch(e){}},250);}
 else{
  const hold=document.getElementById('paperPrintHold');if(hold)hold.remove();
  const d=document.createElement('div');d.id='paperPrintHold';d.innerHTML=body;document.body.appendChild(d);
  document.body.classList.add('printing-paper');
  const done=()=>{document.body.classList.remove('printing-paper');if(d.parentNode)d.remove();window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);setTimeout(()=>window.print(),50);
 }
}
