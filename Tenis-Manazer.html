:root{--bg:#060d24;--bg2:#0b1a42;--card:rgba(20,40,95,.55);--card2:rgba(30,60,135,.45);--line:rgba(120,170,255,.18);--txt:#eaf2ff;--mut:#8ea6d8;--acc:#36d1ff;--acc2:#ffd34d;--good:#3ee68a;--bad:#ff5d73;--warn:#ffb648;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030817;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:15px}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;position:relative;background:radial-gradient(120% 60% at 50% -10%,#1b3f9a 0%,#0b1a42 45%,#060d24 100%);overflow-x:hidden;padding-bottom:78px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select{font:inherit;color:var(--txt);background:rgba(5,15,45,.7);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(180deg,rgba(6,13,36,.97),rgba(6,13,36,.82));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wk{font-weight:800;font-size:13px;line-height:1.1}.top .wk small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.gold{color:var(--acc2)}.pill.cy{color:var(--acc)}
.sp{flex:1}
.view{padding:12px 12px 20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:6px}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:800}.c{text-align:center}.r{text-align:right}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.gold{color:var(--acc2)}.cy{color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:800;letter-spacing:.02em;background:linear-gradient(180deg,#3fb7ff,#1f6fe6);box-shadow:0 6px 18px rgba(31,111,230,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,filter .2s;text-transform:uppercase;font-size:14px}
.btn:active{transform:scale(.97)}.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.big{width:100%;padding:16px;font-size:16px;border-radius:16px}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#f2a514);color:#2b1a00;box-shadow:0 6px 18px rgba(242,165,20,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.green{background:linear-gradient(180deg,#5ef0a0,#14a85a);color:#032112}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line);text-transform:none;font-weight:700}
.btn.red{background:linear-gradient(180deg,#ff7b8d,#d6304a)}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:11px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;z-index:30;background:linear-gradient(0deg,rgba(4,9,28,.99),rgba(8,18,50,.95));border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:5px 0;border-radius:12px;font-weight:700}
.nav button .i{font-size:21px;filter:grayscale(.6);transition:transform .2s}
.nav button.on{color:#fff;background:rgba(54,209,255,.12)}.nav button.on .i{filter:none;transform:translateY(-2px) scale(1.1)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2a8cff,#36d1ff);transition:width .5s}
.bar.en>i{background:linear-gradient(90deg,#ff5d73,#ffb648 40%,#3ee68a 75%)}
.bar.xp{height:4px;margin-top:3px}.bar.xp>i{background:linear-gradient(90deg,#ffd34d,#ff9f2e)}
/* level bars like segmented */
.lvl{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;margin:7px 0}
.lvl .nm{font-size:12.5px;color:var(--mut);font-weight:700}
.lvl .v{font-weight:900;text-align:right;font-size:15px}
.seg{display:flex;gap:2px;height:10px}
.seg span{flex:1;border-radius:2px;background:rgba(255,255,255,.08)}
.seg span.on{background:linear-gradient(180deg,#5fe0ff,#2076ff);box-shadow:0 0 6px rgba(54,209,255,.5)}
.seg span.hi{background:linear-gradient(180deg,#ffe27a,#f2a514);box-shadow:0 0 6px rgba(255,211,77,.5)}
.ov{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ov b{font-size:30px;font-weight:900;line-height:1}.ov small{font-size:9px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;display:block;text-align:center}

.injbox .ii{font-size:28px;width:40px;height:40px;display:grid;place-items:center;background:rgba(255,93,115,.2);border-radius:12px;animation:injp 1.6s infinite}
@keyframes injp{50%{box-shadow:0 0 0 6px rgba(255,93,115,0),0 0 14px rgba(255,93,115,.5)}}
.injpulse{font-size:54px;display:inline-grid;place-items:center;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,93,115,.35),rgba(255,93,115,.05));animation:injp 1.2s infinite}
.injtag{font-size:13px;margin-left:auto;padding:1px 4px;border-radius:6px;background:rgba(255,93,115,.2);border:1px solid rgba(255,93,115,.4)}
.injn{border-left:3px solid #ff5d73!important}
.injprog{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}.injprog i{display:block;height:100%;background:linear-gradient(90deg,#ff5d73,#ffb648,#3ee68a);border-radius:9px}
/* celebration */
.celebr{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(40,80,180,.65),rgba(2,6,20,.94));animation:fade .3s}
.celebr canvas{position:absolute;inset:0;pointer-events:none}
.cbox{position:relative;text-align:center;padding:20px}
.cbox .rays{position:absolute;left:50%;top:95px;width:420px;height:420px;margin:-210px 0 0 -210px;background:repeating-conic-gradient(rgba(255,211,77,.16) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cbox .tw{position:relative;animation:trophy 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes trophy{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.cbox .ct{position:relative;font-size:38px;font-weight:900;letter-spacing:.1em;background:linear-gradient(180deg,#fff4b8,#ffd34d 50%,#e08a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.cbox .cn{position:relative;font-size:18px;font-weight:800;margin-top:4px}
/* ===================== v4 premium skin ===================== */
:root{--disp:TMSport,"Arial Narrow",system-ui,sans-serif;--card:rgba(18,36,88,.62);--card2:rgba(30,62,140,.5);--line:rgba(130,180,255,.16);--gold1:#fff1a8;--gold2:#ffc531;--gold3:#d48a00}
html,body{background:#02061a}
body{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#app{background:
 radial-gradient(60% 28% at 12% -4%,rgba(80,140,255,.45),transparent 70%),
 radial-gradient(50% 24% at 92% -2%,rgba(54,209,255,.3),transparent 70%),
 radial-gradient(120% 70% at 50% 0%,#14307a 0%,#0a1844 42%,#050c28 75%,#030820 100%);
 padding-bottom:96px}
#app:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px);z-index:0}
#app>*{position:relative;z-index:1}
.view{animation:viewin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
/* type */
.b,.tile b,.lvl .v,.rankbadge b,.ov b,h2,.card h3,.btn,.pill,.tier,.surf,.tabs button,.seg-t button,.nav .nl,.top .wk,.ev .t b,.rk td.b,.logo,.mv{font-family:var(--disp)}
.b{letter-spacing:.01em}
h2{font-weight:800;letter-spacing:.01em;font-size:24px!important}
.card h3{font-weight:800;font-size:14px;letter-spacing:.12em;color:#9fb8ec}
/* top bar */
.top{background:linear-gradient(180deg,rgba(4,10,32,.96),rgba(6,14,42,.78));border-bottom:1px solid rgba(120,170,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.3);padding:9px 12px}
.top .wk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.top .wk .wkn{display:grid;place-items:center;min-width:36px;height:30px;padding:0 6px;border-radius:9px;background:linear-gradient(180deg,#3fb7ff,#1d5fd0);font-size:16px;font-style:italic;box-shadow:0 4px 12px rgba(31,111,230,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.top .wk small{font-family:system-ui;font-size:10.5px}
.pill{gap:4px;padding:5px 10px 5px 7px;font-size:15px;font-weight:800;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(150,190,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.pill .ico{width:16px;height:16px}
.pill.gold{color:#ffd65a}.pill.cy{color:#5fe0ff;cursor:pointer}.pill.en{color:#5ef0a0}.pill.en.low{color:#ff6b80;animation:glow 1s infinite alternate}
.ico{width:22px;height:22px;flex:none}
/* nav – floating glass dock */
.nav{background:none;border:0;padding:0 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.navin{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:22px;background:linear-gradient(180deg,rgba(22,44,104,.92),rgba(8,18,52,.96));border:1px solid rgba(140,190,255,.22);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav button{flex:1;gap:1px;padding:7px 0 5px;border-radius:16px;color:#7f97c9;position:relative;transition:color .2s}
.nav button .i{filter:none;line-height:0}
.nav button .ico{width:23px;height:23px;transition:transform .25s}
.nav .nl{font-size:12px;font-weight:600;letter-spacing:.03em}
.nav button.on{color:#fff;background:linear-gradient(180deg,rgba(63,183,255,.35),rgba(31,111,230,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 18px rgba(54,170,255,.25)}
.nav button.on .ico{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 6px rgba(95,224,255,.8));color:#8ff0ff}
.nav button.on:after{content:"";position:absolute;bottom:2px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:3px;background:#5fe0ff;box-shadow:0 0 8px #5fe0ff}
/* cards with gradient borders */
.card{border:1px solid transparent;background:linear-gradient(165deg,rgba(32,64,146,.62),rgba(12,26,70,.78)) padding-box,linear-gradient(160deg,rgba(140,190,255,.45),rgba(120,170,255,.06) 45%,rgba(255,211,77,.18)) border-box;border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.07)}
.tile{border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(150,190,255,.14)}
.tile b{font-size:22px;font-weight:800}
/* hero player card */
.hero{border-radius:24px;padding:16px 14px;border:1px solid transparent;background:
 radial-gradient(90% 70% at 100% 0%,rgba(95,224,255,.28),transparent 60%),
 linear-gradient(150deg,#2f6cf0 0%,#1b3fa8 38%,#0f2468 70%,#0a1a4c 100%) padding-box,
 linear-gradient(140deg,#9fd8ff,rgba(255,255,255,.08) 40%,#ffd34d) border-box;box-shadow:0 18px 44px rgba(10,30,90,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.hero:before{right:-60px;top:-60px;width:220px;height:220px;opacity:.55}
.hero:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.13) 45%,transparent 55%);background-size:250% 100%;animation:sweep 6s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.hero .avatar{width:74px!important;height:74px!important;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(95,224,255,.25),0 8px 20px rgba(0,0,0,.4)}
.hero>.row>div .b{font-size:24px!important;font-weight:800;letter-spacing:.01em}
.rankbadge{min-width:76px;padding:8px 8px 6px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.2));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.3)}
.rankbadge b{font-size:32px;font-weight:800;font-style:italic;background:linear-gradient(180deg,#fff,#bfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rankbadge span{font-family:var(--disp);font-size:11px;font-weight:600}
.avatar{background:none}
/* overall ring */
.ov{box-shadow:0 0 24px rgba(255,211,77,.25)}
.ov b{font-weight:800;font-style:italic;background:linear-gradient(180deg,#fff,#ffe6a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov small{font-family:var(--disp);font-weight:600;font-size:10px}
/* stat bars */
.lvl .nm{font-family:var(--disp);font-size:15px;font-weight:600;color:#a9c0ef;letter-spacing:.02em}
.lvl .v{font-size:19px;font-weight:800}
.seg{gap:2px;height:11px;padding:2px;border-radius:6px;background:rgba(0,0,0,.25);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.seg span{border-radius:2px;background:rgba(255,255,255,.06)}
.seg span.on{background:linear-gradient(180deg,#8cf0ff,#2b8cff 60%,#1d5fd0)}
.seg span.hi{background:linear-gradient(180deg,#fff3b0,#ffc531 60%,#e08a00)}
.bar{height:9px;background:rgba(0,0,0,.3);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.bar>i{box-shadow:0 0 10px rgba(54,209,255,.45)}
/* buttons */
.btn{font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;border-radius:15px;background:linear-gradient(180deg,#5cc8ff 0%,#2a86f0 48%,#1b5fd0 100%);box-shadow:0 4px 0 #0f3b8f,0 10px 22px rgba(31,111,230,.45),inset 0 1px 0 rgba(255,255,255,.55);position:relative;overflow:hidden;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f3b8f,0 4px 10px rgba(31,111,230,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold{background:linear-gradient(180deg,#fff2a8 0%,#ffc531 50%,#e89400 100%);color:#2b1700;box-shadow:0 4px 0 #9a5d00,0 10px 24px rgba(242,165,20,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.btn.gold:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:btnsh 3.2s infinite}
@keyframes btnsh{0%,70%{left:-60%}100%{left:130%}}
.btn.green{background:linear-gradient(180deg,#8bffc0,#25c46e 55%,#119250);box-shadow:0 4px 0 #0a5f33,0 10px 22px rgba(20,168,90,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.red{background:linear-gradient(180deg,#ff9aa8,#ef4b63 55%,#c22540);box-shadow:0 4px 0 #7d1426,0 10px 22px rgba(214,48,74,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.12);border:1px solid rgba(150,190,255,.22);letter-spacing:.03em}
.btn.ghost:active{transform:scale(.97)}
.btn.sm{font-size:13px;padding:8px 12px;box-shadow:0 3px 0 #0f3b8f,inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost.sm{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.gold.sm{box-shadow:0 3px 0 #9a5d00,inset 0 1px 0 rgba(255,255,255,.7)}
/* tabs & segmented */
.tabs{background:rgba(0,0,0,.25);border:1px solid rgba(150,190,255,.12);border-radius:15px;padding:4px}
.tabs button{font-size:15px;font-weight:600;letter-spacing:.03em;border-radius:11px}
.tabs button.on{background:linear-gradient(180deg,#4db8ff,#1f6fe6);box-shadow:0 4px 12px rgba(31,111,230,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.seg-t{background:rgba(0,0,0,.28);border:1px solid rgba(150,190,255,.1)}
.seg-t button{font-size:14px;font-weight:600}
.seg-t button.on{background:linear-gradient(180deg,#4db8ff,#1f6fe6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
/* tournament rows */
.ev{position:relative;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc,#36d1ff) 16%,transparent),rgba(255,255,255,.03) 45%);border:1px solid rgba(150,190,255,.14);overflow:hidden}
.ev:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--tc,#36d1ff);box-shadow:0 0 10px var(--tc,#36d1ff)}
.ev .ic{background:none!important;border:0!important;width:46px;height:46px}
.ev .t b{font-size:17px;font-weight:800}
.emb{filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.tier{font-family:var(--disp);font-size:12px;font-weight:800;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.surf{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.03em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
/* ranking table */
.rk td{font-size:14px;border-bottom:1px solid rgba(150,190,255,.07)}
.rk tr:nth-child(-n+3) td:first-child{color:#ffd65a;font-size:17px}
.rk tr.me td{background:linear-gradient(90deg,rgba(255,211,77,.18),rgba(255,211,77,.04))}
.rk td.b:first-child{font-style:italic;font-size:16px}
/* modals */
.modal-bg{background:rgba(1,4,16,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{border:1px solid transparent;background:linear-gradient(180deg,#183a86,#0b1a48 60%,#08133a) padding-box,linear-gradient(180deg,rgba(150,200,255,.5),rgba(150,200,255,.05)) border-box;border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:sheetin .32s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetin{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{font-family:var(--disp);font-size:16px;font-weight:600;border-radius:14px;background:linear-gradient(180deg,#2a55c0,#14306e);box-shadow:0 12px 30px rgba(0,0,0,.45)}
/* ===== match view v4 ===== */
.mview{background:#03060f}
.court-wrap{background:#060a18}
.court{display:block}
.tvsb{margin:6px 8px 4px;border-radius:12px;background:linear-gradient(180deg,rgba(10,22,64,.97),rgba(4,10,34,.97));border:1px solid rgba(150,200,255,.3)}
.tvsb .tvh{background:linear-gradient(90deg,#2160f0,#1238a8 60%,#0b2468);font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.1em;padding:3px 8px}
.tvsb .tvh .emb{filter:none}
.tvsb .pl{font-family:var(--disp);font-size:18px;font-weight:800;padding:4px 8px 4px 6px}
.tvsb .nm{letter-spacing:.03em}
.tvsb .st{font-size:19px;font-weight:800}
.tvsb .st.cur{background:linear-gradient(180deg,#fff,#d8e6ff);color:#06102a;border-radius:5px}
.tvsb .pt{font-size:19px;font-weight:800;background:linear-gradient(180deg,#fff2a8,#ffc531 55%,#e89400);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.tvflag{font-family:var(--disp);font-size:12px}
.callout{font-family:var(--disp);font-style:italic;font-weight:800;font-size:44px;letter-spacing:.02em;text-transform:uppercase;-webkit-text-stroke:1.5px rgba(0,0,0,.35);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px currentColor;top:44%}
.rally{font-family:var(--disp);background:linear-gradient(180deg,rgba(10,22,64,.85),rgba(4,10,34,.85));border:1px solid rgba(150,200,255,.3);border-radius:12px;font-size:11px;letter-spacing:.1em}
.rally b{font-size:24px;font-style:italic}
.spdbox{position:absolute;left:8px;top:36%;display:flex;flex-direction:column;align-items:center;padding:5px 9px;border-radius:12px;background:linear-gradient(180deg,rgba(10,22,64,.88),rgba(4,10,34,.88));border:1px solid rgba(150,200,255,.3);font-family:var(--disp);opacity:0;transform:translateX(-20px);pointer-events:none}
.spdbox em{font-style:normal;font-size:10px;letter-spacing:.1em;color:#9fb8ec}.spdbox b{font-size:26px;font-style:italic;line-height:1;color:#e8ff3a}.spdbox span{font-size:10px;color:#9fb8ec}
.spdbox.show{animation:spdin 2.2s ease forwards}
@keyframes spdin{0%{opacity:0;transform:translateX(-20px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-10px)}}
.hawk{position:absolute;right:8px;bottom:56px;opacity:0;pointer-events:none;text-align:center;background:linear-gradient(180deg,rgba(10,22,64,.95),rgba(4,10,34,.95));border:1px solid rgba(150,200,255,.35);border-radius:12px;padding:5px}
.hawk .hk-t{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.1em;color:#ffd65a;margin-bottom:3px}
.hawk.show{animation:hk 2.6s ease forwards}
@keyframes hk{0%{opacity:0;transform:scale(.8)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.lower3{font-family:var(--disp);font-size:13px}.lower3 b{font-size:20px}.lower3 em{font-size:12px}
.comm{background:linear-gradient(180deg,rgba(14,28,72,.8),rgba(6,14,40,.8));border:1px solid rgba(150,190,255,.14);font-size:13px}
.mctrl .btn{font-size:14px}
#crowd.cheer image{animation:cj .22s ease-in-out 4 alternate}
#crowd.cheer2 image{animation:cj .18s ease-in-out 7 alternate}
@keyframes cj{to{transform:translateY(-1.4px)}}
.flash{fill:#fff;opacity:0;animation:fl .35s ease-out 2}
@keyframes fl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff .65s ease-out forwards}
@keyframes puff{from{transform:scale(.6);opacity:.95}to{transform:scale(3.2,2.4);opacity:0}}
.fig .body{animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(1.6px)}}
.fig.run .body{animation:none}
.fig .arm{transform-origin:14px -84px}
.fig .legL{transform-origin:-7px -52px}.fig .legR{transform-origin:7px -52px}
.kc{border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.kc .kn{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.02em}
.kc .kco{font-family:var(--disp);font-size:12px}
/* splash */
#splash{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 70% at 50% 10%,#1b46b8,#081640 55%,#030820);transition:opacity .5s}
#splash.gone{opacity:0;pointer-events:none}
#splash .sl{font-family:var(--disp);font-weight:800;font-style:italic;font-size:42px;line-height:.9;text-align:center;letter-spacing:.02em;background:linear-gradient(180deg,#fff,#bfe9ff 60%,#5fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .sl small{display:block;font-size:15px;letter-spacing:.35em;color:#ffd65a;-webkit-text-fill-color:#ffd65a;margin-top:6px}
#splash .sp2{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#e8ff3a;animation:spin .8s linear infinite}
#splash .err{max-width:86%;color:#ffb3be;font:13px/1.4 system-ui;text-align:center;white-space:pre-wrap}
.logo{font-weight:800!important;font-style:italic;font-size:46px!important;line-height:.9!important;background:linear-gradient(180deg,#fff,#bfe9ff 60%,#5fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.logo small{-webkit-text-fill-color:#ffd65a;letter-spacing:.35em!important}
.mview>*{flex:none}.mview>.court-wrap{flex:1 1 auto;min-height:260px}
.court{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none;max-height:none}
.mview .cards{padding:4px 10px}
.mview .kc{height:84px;width:72px}
.mview .kc .kring{width:36px;height:36px}.mview .kc .ki{font-size:21px}
.hero>*{position:relative;z-index:1}
.hero:before{z-index:0;opacity:.16;right:-70px;top:auto;bottom:-80px}
select{-webkit-appearance:none;appearance:none;background-color:rgba(5,15,45,.85)!important;color:#eaf2ff!important;background-image:linear-gradient(45deg,transparent 50%,#9fb8ec 50%),linear-gradient(135deg,#9fb8ec 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
select option{color:#111;background:#fff}
input{-webkit-appearance:none;appearance:none}
#splash .hint{font:600 14px/1.4 system-ui;color:#cfe0ff;text-align:center;opacity:0;animation:hintin .4s ease 4s forwards}
#splash .hint small{font-weight:500;color:#8ea6d8}#splash .hint b{color:#5fe0ff}
@keyframes hintin{to{opacity:1}}
.rally{padding:3px 7px;font-size:9px}.rally b{font-size:19px}

/* ---- v6: betting, integrity, staff ---- */
.betcard .betrow{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.betcard .betrow:last-child{border-bottom:0}
.betcard .betrow.own{opacity:.95}
.pubbar{height:5px;border-radius:99px;background:rgba(255,93,115,.35);margin:6px 0 2px;overflow:hidden}
.pubbar i{display:block;height:100%;background:linear-gradient(90deg,#36d1ff,#3ee68a);border-radius:99px}

.liveodds{padding:2px 8px 0;text-align:left;flex:none;z-index:3}

.lov-bar{margin:4px 0 3px;height:6px}

/* v7: neomezené peníze, noviny, tiskovky, chat sázkařů */
.infbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;margin:0 4px 0 2px;border-radius:999px;background:linear-gradient(180deg,#ffe38a,#d7a84a);color:#2a1d06;font-weight:800;font-size:12px;line-height:1;padding:0 6px}
.paper-card{cursor:pointer}
.paper-card.fresh{box-shadow:0 0 0 1px rgba(255,211,77,.55),0 8px 24px rgba(0,0,0,.25)}
.paper-new{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:#ffd34d;color:#2a1d06;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.paper-wrap{max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch}
.paper-sheet{background:#f4ecd6;color:#1c170f;border-radius:6px;padding:14px 16px 18px;font-family:Georgia,'Times New Roman',serif;box-shadow:inset 0 0 0 1px rgba(40,28,10,.18)}
.pmast-top,.pmast-bot{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-top:2px solid #1c170f;border-bottom:2px solid #1c170f;padding:4px 0;color:#3a2a16}
.pmast-name{font-size:28px;text-align:center;margin:8px 0 6px;letter-spacing:.05em;font-weight:700;color:#1c170f;line-height:1.05}
.pkicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:12px;color:#6a3d16}
.phead{font-size:22px;line-height:1.2;margin:6px 0 8px;color:#1c170f}
.plead{font-size:14px;line-height:1.45;margin:0 0 12px;color:#2a2216}
.pcols{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.pcols{grid-template-columns:1fr 1fr}.pmast-name{font-size:34px}.phead{font-size:26px}}
.pcol h4{margin:0 0 4px;font-size:13px;color:#1c170f}
.pcol p{margin:0;font-size:12.5px;line-height:1.45;color:#2a2216}
.press-j{font-size:13px;margin-top:4px}
.press-as{display:flex;flex-direction:column;gap:8px}
.press-a{text-align:left;white-space:normal;line-height:1.35;padding:10px 12px}
.press-a .tiny{display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.betchat{margin:4px 8px 2px;padding:4px 8px 5px;border-radius:8px;background:rgba(6,12,28,.55);border:1px solid rgba(120,170,255,.18);font-size:11px;line-height:1.3;max-height:72px;overflow:hidden}

.betchat.closed{max-height:none;padding:3px 8px}
.bc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(230,240,255,.75);margin-bottom:2px}

 .betchat{margin:2px 6px;padding:2px 6px 3px;max-height:56px;font-size:10px}
 .betchat.open{max-height:78px}
 .bc-hd{margin-bottom:1px}
}

 body.printing-paper *{visibility:hidden}
 body.printing-paper #paperSheet,body.printing-paper #paperSheet *{visibility:visible}
 body.printing-paper #paperSheet{position:absolute;left:0;top:0;width:100%;background:#f6efd9;color:#1a160e;box-shadow:none;border-radius:0}

 #mbg,nav.nav,div.top,div.mview,.btn{display:none !important}
 #paperSheet, #paperSheet *{visibility:visible}
 #paperSheet{position:absolute;left:0;top:0;width:auto;background:#f6efd9 !important;color:#1a160e !important}
}

// Distribute each player's real ranking points across the calendar by running a silent "previous season" and rescaling
function bootstrapRankings(){
 for(const p of S.players){p.pw.fill(0);if(!p.isMe)p.pw[0]=p.init;}
 computeRanks();
 const saveWeek=S.week,saveSeason=S.season;S._silent=true;
 setCalendar(saveSeason-1);
 for(let w=1;w<=52;w++){S.week=w;S.weekStarted=false;startWeek(true);endWeek(true);}
 S.week=saveWeek;S.season=saveSeason;S._silent=false;setCalendar(saveSeason);S.events=[];S.news=[];for(const k in S.results)S.results[k].season=S.season-1;
 for(const p of S.players){if(p.isMe){p.pw.fill(0);continue;}
  const sum=totalPts(p);
  if(sum>0){const f=p.init/sum;p.pw=p.pw.map(v=>Math.round(v*f));}
  else{p.pw.fill(0);const n=Math.max(1,Math.min(6,Math.round(p.init/30)));for(let k=0;k<n;k++)p.pw[rint(0,51)]+=Math.round(p.init/n);}
  p.titles=0;p.sw=0;p.sl=0;p.form=0;
 }
 for(const p of S.players){p.prev=null;p.best=null;}
 computeRanks();for(const p of S.players){p.prev=p.rank;p.best=p.rank;}
 S.week=1;S.weekStarted=false;
}

function computeRanks(){
 const arr=S.players.filter(p=>!p.retired);
 for(const p of arr)p._t=totalPts(p);
 arr.sort((a,b)=>b._t-a._t||overallOf(b.st)-overallOf(a.st));
 let r=0;for(const p of arr){if(p._t>0){r++;p.rank=r;}else p.rank=null;if(p.rank&&(!p.best||p.rank<p.best))p.best=p.rank;}
 S.order=arr.map(p=>p.id);
 return arr;
}

function quickMatch(a,b,surf,bo,cc){
 const d=rating(a,surf)-rating(b,surf)+(cc?((a.cc===cc?0.7:0)-(b.cc===cc?0.7:0)):0);
 const ps=setWinP(d);
 const need=Math.ceil(bo/2);const w=[0,0];const sets=[];
 while(w[0]<need&&w[1]<need){
  const sw=RNG()<ps?0:1;w[sw]++;
  const close=1-Math.abs(ps-.5)*1.6;
  const r=RNG();let lg;
  const weights=[0.25*(1.4-close),0.6*(1.3-close*0.6),1.5,2.2,2.2,1.2*close+0.4,1.4*close+0.4];
  let tot=weights.reduce((x,y)=>x+y,0),acc=0;lg=6;for(let i=0;i<7;i++){acc+=weights[i]/tot;if(r<acc){lg=i;break;}}
  let s;if(lg<=4)s=[6,lg];else if(lg===5)s=[7,5];else s=[7,6,rint(0,9)];
  sets.push(sw===0?[s[0],s[1],s[2]]:[s[1],s[0],s[2]]);
 }
 return {w:w[0]>w[1]?a.id:b.id,sets};
}

function seedOrder(n){let o=[1,2];while(o.length<n){const m=o.length*2;const r=[];for(const x of o){r.push(x);r.push(m+1-x);}o=r;}return o;}

function simMatchAI(ev,m){

function activeBusy(){const b=new Set();for(const ev of S.events){if(!ev.done&&ev.end>=S.week)for(const id of ev.ent)if(id)b.add(id);}return b;}
function eventsThisWeek(){return CAL.filter(t=>t.week===S.week);}
function eligibility(t,p){
 p=p||ME();const tier=TIERS[t.tier];const r=p.rank||2500;const MAIN=evMain(t),QUAL=evQual(t);
 if(p.injury>0)return {mode:null,txt:'Jsi zraněný – nemůžeš startovat.'};
 if(t.tier==='FIN'){return r<=8?{mode:'main',txt:'Kvalifikován do Finále'}:{mode:null,txt:'Pouze top 8 žebříčku'};}
 if((t.tier==='M15'||t.tier==='M25')&&p.rank&&p.rank<=100)return {mode:null,txt:'Hráči z top 100 nesmí startovat na turnajích ITF'};
 if(t.tier[0]==='C'&&p.rank&&p.rank<=10)return {mode:null,txt:'Hráči z top 10 nesmí startovat na Challengerech'};
 if(r<=MAIN)return {mode:'main',txt:'Přímý postup do hlavní soutěže'};
 const home=t.cc===p.cc;
 if(home&&t.tier[0]==='C'){const lim=t.tier==='C50'||t.tier==='C75'?2400:t.tier==='C100'?1600:MAIN*2.8;if(!p.rank||r<=lim)return {mode:'wc',txt:'Divoká karta pro domácího hráče'};}

 if(home&&(t.tier==='A250')&&r<=400)return {mode:'wc',txt:'Divoká karta pro domácího hráče'};
 const pop=p.pop||0;const WCP={A250:[35,400],A500:[50,260],M1000:[60,240],GS:[72,300],C175:[30,500],C125:[25,700],C100:[20,800],C75:[15,900],C50:[12,1200]}[t.tier];
 if(WCP&&pop>=WCP[0]-(home?10:0)&&r<=WCP[1]&&r>MAIN)return {mode:'wc',txt:`Divoká karta díky popularitě (❤️ ${Math.round(pop)})`};

function travelCost(t,p){p=p||ME();const c=COUNTRIES[p.cc];const d=distKm(c[2],c[3],t.lat,t.lon);let cost=180+d*0.11;if(['GS','M1000','FIN'].includes(t.tier))cost*=0.65;if(t.tier==='M15'||t.tier==='M25')cost*=0.48;if(t.tier[0]==='C')cost*=0.75;if(t.cc===p.cc)cost*=0.5;if(t.tier==='FIN'||t.tier==='DC')cost=0;return Math.round(Math.min(cost,2600)/10)*10;}
function distKm(a,b,c,d){const R=6371,toR=Math.PI/180;const x=Math.sin((c-a)*toR/2)**2+Math.cos(a*toR)*Math.cos(c*toR)*Math.sin((d-b)*toR/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

 const tier=t.tier;const age=S.season-p.by;let skip=0.12;
 if(tier==='GS')skip=0.015;else if(tier==='M1000')skip=0.04;
 else if(tier==='A500')skip=r<=10?0.35:0.15;
 else if(tier==='A250')skip=r<=10?0.8:r<=30?0.35:0.12;
 else if(tier[0]==='C')skip=r<=50?0.75:r<=100?0.3:0.14;

// number of qualifiers in the main draw (approximate real formats)

  let qpool=tier.qr?list.slice(direct.length,direct.length+nQ*(1<<tier.qr)):[];

  if(qpool.length>=2&&nQ>0){
   const per=Math.max(1,Math.floor(qpool.length/nQ));
   for(let g=0;g<nQ;g++){let grp=qpool.slice(g*per,(g+1)*per);if(g===nQ-1)grp=qpool.slice(g*per);
    let k=0;while(grp.length>1&&k<tier.qr){const nx=[];for(let i=0;i<grp.length;i+=2){if(i+1>=grp.length){nx.push(grp[i]);continue;}const a=P(grp[i]),b=P(grp[i+1]);const q=quickMatch(a,b,t.surf,3,t.cc);const l=q.w===a.id?b.id:a.id;qres[l]=k;nx.push(q.w);matchInjury(q.w===a.id?b:a,t,false);}grp=nx;k++;}
    if(grp[0])qualifiers.push(grp[0]);}
  } else direct=list.slice(0,D-(isHuman?1:0));

  if(mainList.length<D){const extra=list.filter(id=>!mainList.includes(id)&&qres[id]==null).slice(0,D-mainList.length-(isHuman?1:0));mainList=mainList.concat(extra);}

  const ev=createEvent(t,mainList);
  ev.ent=mainList.concat(Object.keys(qres));
  const tab=tierTab(t);
  for(const id in qres){const k=qres[id];ev.extra[id]={pts:tab.qpts[tier.qr-k]||0,prize:evQPrize(t,tier.qr-1-k)};}
  for(const id of qualifiers)ev.extra[id]={pts:tab.qpts[0]||0,prize:0,q:1};
  S.events.push(ev);

   const mode=S.plan.mode;S.cur={ev:ev.id,stage:'main',status:'alive',qual:null,mode,last:-1};
   if(mode==='qual'){const free=order.filter(p=>!busy.has(p.id)&&p.rank&&!p.isMe&&!(p.injury>0));

    const opps=shuffle(poolQ).slice(0,tier.qr).sort((a,b)=>rankOf(b)-rankOf(a)).map(p=>p.id);

 }

}

function migrateSave(s){if(!s||typeof s!=='object')return s;
 s.v=s.v||1;
 if(s.players)for(const p of s.players){if(p.prev===undefined)p.prev=p.rank;if(p.injH==null)p.injH=[];if(p.load==null)p.load=0;if(p.isMe){if(p.pop==null){p.pop=2;p.spons={};p.popHist=[];}if(!p.tac)p.tac=Object.assign({},TAC_DEF);if(!p.season0)p.season0={w:0,l:0,titles:0,prize:0};if(!p.xp)p.xp={fh:0,bh:0,srv:0,ret:0,kon:0,men:0};}}
 if(!s.injNews)s.injNews=[];
 if(!s.news)s.news=[];
 if(s.v<6){s.v=GAME_VER;}
 return s;}
function saveGame(){if(!S||S._silent)return;try{S.v=GAME_VER;const c=Object.assign({},S);delete c.order;delete c._silent;const RP=(k,v)=>typeof v==='number'&&v%1!==0?Math.round(v*1000)/1000:v;let js=JSON.stringify(c,RP);
 if(!STORE.set(SAVE_KEY,js)){// quota exceeded: trim history and retry
  c.news=(c.news||[]).slice(0,40);c.injNews=(c.injNews||[]).slice(0,30);c.results={};js=JSON.stringify(c,RP);if(!STORE.set(SAVE_KEY,js)&&!S._warnedSave){S._warnedSave=1;if(typeof toast==='function')toast('⚠️ Hru nelze uložit do prohlížeče (soukromý režim?). Použij Export.');}}}catch(e){console.warn('save failed',e);}}
function loadGame(){try{const raw=STORE.get(SAVE_KEY);if(!raw)return false;S=migrateSave(JSON.parse(raw));if(!S.players||!S.season)throw new Error('poškošený save');rebuildIndex();setCalendar(S.season);computeRanks();return true;}catch(e){console.warn(e);S=null;return false;}}
function resetGame(){STORE.del(SAVE_KEY);S=null;}

  if((m.a==='me'||m.b==='me')&&S.curDbl&&S.curDbl.status==='alive'&&!S._silent){/* wait for human, but at week end auto-sim remaining */}
  const A=m.ap||P(m.a),B=m.bp||P(m.b);if(!A||!B){m.w=m.a||m.b;continue;}const q=quickMatch(A,B,ev.surf,3,ev.cc);m.w=q.w;m.sets=q.sets;}
 if(ev.rounds[ev.cur].every(m=>m.w||m.void)){if(ev.rounds[ev.cur].length===1){ev.champ=ev.rounds[ev.cur][0].w;ev.done=true;ev.res[ev.champ]=ev.nr;}
  else{const r=ev.rounds[ev.cur];const nx=[];for(let i=0;i<r.length;i+=2)nx.push({a:r[i].w,b:r[i+1].w,w:null,sets:null});ev.cur++;ev.rounds.push(nx);}}
 }
 const week=S.week-1>=0?S.week-1:0;
 for(const id in ev.res){const res=ev.res[id];const idx=Math.max(0,ev.nr-res);const pts=dblPtsFor(ev.tier,idx);const p=P(id);if(p){p.dpw=p.dpw||new Array(52).fill(0);p.dpw[week]=(p.dpw[week]||0)+pts;}}
 if(ev.champ){const w=P(ev.champ);if(w){w.dsw=(w.dsw||0)+1;if(w.isMe){ME().car.dtitles=(ME().car.dtitles||0)+1;ME().car.dblTitleList=ME().car.dblTitleList||[];ME().car.dblTitleList.push({s:S.season,name:ev.name,tier:ev.tier});if(!S._silent)S.news.unshift({w:S.week,s:S.season,t:`🤝 Titul ve čtyřhře! ${ev.name}`});}}}
 computeDRanks();checkAchievements();}

function v6AfterEndWeek(silent,earned){if(silent||S._silent)return;
 for(const ev of (S._endedNow||[])){settleBetsForEvent(ev);if(ev.dbl)v6FinalizeDoubles(ev,earned);if(ev.dc&&ev.human&&ev.done){/* score already resolved */}}
 integrityTick();updateSponsors(ME());computeDRanks();
 const me=ME();if(me&&!(typeof hasInfMoney==='function'&&hasInfMoney())&&me.money<-5000){let fired=false;for(const k of ['manager','mental','fitness','physio']){if(staffLvl(me,k)>0){me[k]=0;if(k==='physio')me.fyzio=0;fired=true;}}if(me.coach>1){me.coach=1;fired=true;}if(fired)S.news.unshift({w:S.week,s:S.season,t:'💸 Došly peníze — část týmu jsi musel propustit.'});}
}

 else if(!(fin&&me.rank&&me.rank<=8)){const list=eventsThisWeek().filter(t=>eligibility(t).mode).sort((a,b)=>TIERS[b.tier].rankOrd-TIERS[a.tier].rankOrd).slice(0,3);

function evRow(t,compact){const e=eligibility(t);const sel=S.plan&&S.plan.tid===t.id;const tier=TIERS[t.tier];const canAct=t.week===S.week&&!S.weekStarted&&!S.cur;

 const last=S.results[t.id];
 return `<div class="ev ${sel?'sel':''}" style="--tc:${tier.color}" onclick="evInfo('${t.id}')"><div class="ic">${tierEmblem(t.tier,44)}</div><div class="t"><b>${esc(t.name)}</b><div class="small mut">${flag(t.cc)} ${esc(t.city)}${t.len>1?' · 2 týdny':''}</div><div class="chips">${tierBadge(t.tier)}${surfChip(t.surf)}${t.tier!=='FIN'?`<span class="tiny mut">${tierTab(t).pts[0]} b. · ${fmtMoney(evPrize(t,0))} · ${t.draw}</span>`:'<span class="tiny mut">až 1500 b.</span>'}</div>${!compact&&last?`<div class="tiny mut" style="margin-top:3px">Poslední vítěz: ${esc(last.champN)} (${last.season})</div>`:''}${canAct&&md?`<div class="tiny cy" style="margin-top:2px">${md}</div>`:''}</div>${btn}</div>`;}

 const rounds=[];if(t.tier==='FIN'){rounds.push(['Výhra ve skupině','200 b.','$396 000'],['Výhra v semifinále','+400 b.','$1 183 000'],['Výhra ve finále','+500 b.','$2 370 000'],['Účast','—','$331 000']);}
 else{const B=pow2(t.draw);const nr=Math.log2(B);for(let i=0;i<=nr;i++){const remain=i===0?1:(1<<i);const nm=i===0?'Vítěz':remain===2?'Finále':remain===4?'Semifinále':remain===8?'Čtvrtfinále':remain===B?'1. kolo':'Kolo '+remain;rounds.push([nm,(tab.pts[i]||0)+' b.',fmtMoney(evPrize(t,i))]);}
  if(tier.qr&&tab.qpts&&tab.qpts.length)rounds.push(['Postup z kvalifikace','+'+tab.qpts[0]+' b.','—']);}

 const canAct=t.week===S.week&&!S.weekStarted&&!S.cur;const MAIN=evMain(t),QUAL=evQual(t);
 modal(`<div class="row"><div class="ic">${tierEmblem(t.tier,52)}</div><div style="flex:1"><h2 style="margin:0">${esc(t.name)}</h2><div class="small mut">${flag(t.cc)} ${esc(t.city)} · týden ${t.week}${t.len>1?'–'+(t.week+t.len-1):''} · ${weekLabel(S.season,t.week,t.len)}</div></div></div>

 <div class="small mut" style="margin-bottom:8px">${surfTxt}</div>
 <table class="stt">${rounds.map(r=>`<tr><td style="text-align:left;font-weight:700">${r[0]}</td><td>${r[1]}</td><td style="text-align:right">${r[2]}</td></tr>`).join('')}</table>
 <div class="small" style="margin-top:10px">${t.tier!=='FIN'?`Hlavní soutěž do ~${MAIN>=99999?'∞':MAIN+'.'} místa${tier.qr?` · kvalifikace do ~${QUAL>=9999?'∞':QUAL+'.'} místa`:''}`:'Nejlepších 8 zdravých hráčů žebříčku'}</div>

 <div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" onclick="closeModal()">Zavřít</button>${canAct&&e.mode&&t.tier!=='FIN'?`<button class="btn gold" style="flex:1" onclick="uiPlan('${t.id}')">Přihlásit se</button>`:''}</div>`);}

 const fin=CAL.find(t=>t.week===S.week&&t.tier==='FIN');const finMe=fin&&me.rank&&me.rank<=8&&me.injury<=0;

function startDaily(){const d=getDaily();if(d.done)return;if(UI.busy)return;if(ME().injury>0){toast('🩹 Jsi zraněný – exhibici si zahraješ až po uzdravení.');return;}if(S.cur&&S.cur.status==='alive'){toast('Nejdřív dohraj turnaj.');return;}const me=ME();const o=P(d.opp);
 const saveEn=me.energy;me.energy=100;
 openMatch({opp:o,surf:d.surf,bo:1,title:'Denní výzva · Exhibice',sub:d.txt,daily:true,onEnd:(m)=>{me.energy=saveEn;const ok=dailyCheck(m);d.tries=(d.tries||0)+1;if(ok){d.done=true;me.money+=d.reward.money;const r=addXp(d.reward.stat,d.reward.xp,true);saveGame();return `<div class="good b" style="font-size:17px">⭐ Výzva splněna! +${fmtMoney(d.reward.money)}, +${d.reward.xp} XP ${STAT_NAMES[d.reward.stat]}${r.ups?' ⬆️':''}</div>`;}if(d.tries>=3)d.done='fail';saveGame();return `<div class="bad b">Výzva nesplněna${d.done==='fail'?' – dnešní pokusy vyčerpány.':` – zbývá ${3-d.tries} pokusů.`}</div>`;}});}

function popBar(v){return `<div class="bar" style="height:9px"><i style="width:${v}%;background:linear-gradient(90deg,#ff5d9e,#ffb648)"></i></div>`;}
function sponsorList(me){const list=typeof SPONSORS_V6!=='undefined'?SPONSORS_V6:SPONSORS;const mul=typeof sponsorPayMul==='function'?sponsorPayMul(me):1;return list.map(sp=>{const c=me.spons&&me.spons[sp.id];const on=c&&c.on!==false&&!c.declined;const pay=Math.round((c&&c.pay||sp.pay)*mul);const elig=typeof sponsorEligible==='function'?sponsorEligible(sp,me):(me.pop||0)>=sp.th;const pending=(me.sponsOff||[]).some(o=>o.id===sp.id);return `<div class="shop" style="${on?'border-color:rgba(62,230,138,.5)':pending?'border-color:rgba(255,211,77,.45)':'opacity:.55'}"><div class="si">${sp.icon}</div><div style="flex:1"><b class="small">${sp.name}</b><div class="tiny mut">${sp.desc}${sp.win?` · bonus za postup ${fmtMoney(sp.win)}`:''}</div><div class="tiny ${on?'good':pending?'gold':'mut'}">${on?'✓ Aktivní smlouva':pending?'✍️ Čeká na podpis':elig?'Nabídka je na stole':'🔒 od popularity '+sp.th+(sp.rank?' a žebř. ≤ '+sp.rank:'')}</div></div><div class="c">${pending?`<button class="btn sm gold" onclick="uiAcceptSponsor('${sp.id}')">Přijmout</button><button class="btn sm ghost" onclick="uiDeclineSponsor('${sp.id}')">Ne</button>`:''}<b class="small ${on?'good':'mut'}">${fmtMoney(pay)}<span class="tiny">/týd.</span></b></div></div>`;}).join('');}
function popCard(me){const v=me.pop||0;const next=SPONSORS.find(s=>!(me.spons&&me.spons[s.id]));const ph=me.popHist||[];const mx=Math.max(10,...ph);
 return `<div class="card"><h3>❤️ Popularita<span class="sp"></span><span style="text-transform:none;letter-spacing:0">${fmtFans(followers(v))} fanoušků</span></h3>

 ${ph.length>1?`<div class="chart" style="height:36px;margin-top:8px">${ph.map(x=>`<i style="height:${x/mx*100}%;background:linear-gradient(0deg,#ff5d9e,#ffb648)"></i>`).join('')}</div>`:''}
 <div class="tiny mut" style="margin-top:8px;line-height:1.5">Roste s výhrami, skalpy výše postavených hráčů, tituly (víc na velkých a domácích turnajích) a mediálními aktivitami. Bez hraní a po porážkách pomalu klesá. Přináší sponzory, divoké karty a podporu publika.</div></div>`;}

function profileTxt(p){const st=p.st;const out=[];const wk=weakWing(p);const gap=Math.abs(st.fh-st.bh);

 if(p.hand==='L')out.push('levák');if(p.bh1)out.push('jednoruční bekhend');

function coachPlan(me,o,surf){// recommended tactic for the human
 const t=Object.assign({},TAC_DEF);const ms=effStatsBase(me),os=o.st;
 const gap=Math.abs(os.fh-os.bh);if(gap>=4)t.target=os.bh<os.fh?'bh':'fh';
 t.rally=(surf==='G'||surf==='I')&&Math.max(ms.fh,ms.srv)>=os.kon-2?'atk':surf==='C'&&ms.kon>=os.kon?'def':'bal';
 const vol=(ms.fh+ms.srv+ms.men)/3,pas=(os.fh+os.bh)/2*0.55+os.ret*0.45;
 t.net=surf==='G'&&vol>=pas-3?2:(surf!=='C'&&vol>=pas+2)?1:0;
 t.drop=surf==='C'&&os.kon<=ms.kon?(os.kon<72?2:1):0;
 t.retPos=os.srv>=ms.ret+6?'deep':os.srv<=ms.ret-6?'close':'norm';
 t.srvRisk=ms.srv>=os.ret+6&&surf!=='C'?2:ms.srv<=os.ret-6?0:1;
 t.dir=Math.max(ms.fh,ms.bh)>=os.kon+4?'line':Math.max(ms.fh,ms.bh)<=os.kon-4?'cross':'mix';
 t.pace=ms.kon>=os.kon+5?'fast':'norm';
 return t;}

 const T=MS.trail;T.push([q[0],q[1],r]);if(T.length>9)T.shift();

function buildNewspaper(s,w,welcome){
 const me=ME();const meN=me?me.n:'Hráč';const issueNo=(S.papers&&S.papers.length||0)+1;
 const date=typeof weekLabel==='function'?weekLabel(s,w):('týden '+w+' / '+s);

 let headline,lead,kicker;
 if(welcome){

  cols.push({h:'Co ho čeká',t:'Nejbližší týdny rozhodnou ITF turnaje. Odborníci radí šetřit energii, nevybírat zbytečně daleké cesty a budovat jistotu z čáry.'});
 }else{
  const news=collectWeekNews(s,w);
  const path=(S.cur&&S.cur.path)||(me&&me.hist&&me.hist[0]);
  const won=last&&last.won;const score=last&&last.score;
  const titleNews=news.find(n=>/TITUL|vyhrál/.test(n.t)&&n.t.indexOf(meN)>=0);
  const retNews=news.find(n=>/skreč/i.test(n.t));
  const betNews=news.find(n=>/Sázkaři v šoku|Vyhraná sázka|vrácena/.test(n.t));
  const injNews=news.filter(n=>n.inj||/zraněn|skreč|odstoupil/i.test(n.t));
  const rivNews=news.find(n=>/Rivalita/.test(n.t));
  const intNews=news.find(n=>/Integritní|ovlivňov/i.test(n.t));
  const spNews=news.filter(n=>/sponzor|Smlouv/i.test(n.t));
  const dcNews=news.find(n=>/Davis/.test(n.t));
  const quotes=collectQuotes(s,w);
  if(titleNews){kicker='Zlatá neděle';headline=meN+' bere titul!';lead=titleNews.t+' Redakce listu to považuje za jeden z nejsilnějších příběhů týdne na okruhu.';}
  else if(retNews&&last&&last.won){kicker='Zápas nedohrán';headline='Soupeř skrečoval, '+meN+' postupuje';lead=retNews.t+' Skreč vždycky nechává pachuť, ale tabulka je neúprosná – postup platí.';}
  else if(retNews&&last&&!last.won){kicker='Hořký konec';headline=meN+' skrečoval zápas';lead=retNews.t+' Zdraví je přednější než jeden výsledek, píše naše redakce.';}
  else if(won&&last){kicker='Vítězný týden';headline=meN+' vyhrál a jde dál';lead=meN+' zdolal '+(last.opp||'soupeře')+(score?' '+score:'')+(last.ev?' na turnaji '+last.ev:'')+'. Byl to výkon, ze kterého jde cítit růst.';}
  else if(last&&!won){kicker='Konec cesty';headline='Pro '+meN+' sezonní pouť na turnaji skončila';lead=meN+' podlehl '+(last.opp||'soupeři')+(score?' '+score:'')+'. I z prohry se na okruhu učí – otázka je, jak rychle.';}
  else if(news[0]){kicker='Týden na okruhu';headline=news[0].t.replace(/^[^\wÁ-žA-Z]+/,'');if(headline.length>78)headline=headline.slice(0,76)+'…';lead='Tenisový deník přináší přehled toho nejdůležitějšího, co se na okruhu událo v týdnu '+w+'.';}
  else{kicker='Klid na okruhu';headline='Týden bez velkého zemětřesení';lead='Okruh si oddechl. '+meN+' trávil týden mimo hlavní světla ramp, ale příprava na další start už běží.';}
